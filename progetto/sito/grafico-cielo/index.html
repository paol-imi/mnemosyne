<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Il cielo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
<style>
:root {
  --notte: #0a0f1c; --notte2: #121a2c; --vetro: rgba(16,22,38,.86); --vetro2: rgba(24,32,52,.94);
  --testo: #ece5d3; --tenue: #9aa0ad; --filo: rgba(236,229,211,.16);
  --luce: #f6e7bd;          /* ✦ e ● : la luce */
  --prop: #8c96ab;          /* ◌ : più quieto */
  --avviso: #e2a43c;        /* ⚠ : ambra, mai rosso */
  --mondo: #b7c5d4;         /* ○ */
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --segni: "Noto Sans Symbols 2", "Source Serif 4", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--notte); color: var(--testo); }
body { font: 400 16px/1.45 var(--serif); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--luce); outline-offset: 2px; }
.sg { font-family: var(--segni); font-style: normal; }
.vf { font-family: var(--segni); color: var(--avviso); font-style: normal; }

#cielo { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: grab; }
#cielo:active { cursor: grabbing; }

/* testa */
#testa { position: fixed; top: 0; left: 0; right: 0; z-index: 5; padding: max(8px, env(safe-area-inset-top)) 12px 0;
  background: linear-gradient(var(--notte) 62%, rgba(10,15,28,.7) 80%, rgba(10,15,28,0)); pointer-events: none; }
#testa > * { pointer-events: auto; }
.riga1 { display: flex; align-items: center; gap: 4px; min-height: 44px; }
.marchio { font-variant-caps: all-small-caps; letter-spacing: .1em; font-size: 15px; color: var(--tenue); margin-right: auto; padding-left: 4px; }
@media (max-width: 480px) { .marchio .sub { display: none; } }
.marchio b { color: var(--testo); font-weight: 500; letter-spacing: .06em; }
.tasto { min-width: 44px; height: 44px; border-radius: 22px; display: inline-flex; align-items: center; justify-content: center;
  padding: 0 12px; font: 500 13.5px/1 var(--sans); color: var(--testo); background: rgba(236,229,211,.06); border: 1px solid var(--filo); }
.tasto[aria-pressed="true"] { background: rgba(125,135,156,.22); border-color: var(--prop); }
.tasto .sg { font-size: 15px; }
#lente .sg { color: var(--prop); }
.riga2 { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
#livelli { display: inline-flex; background: rgba(236,229,211,.05); border: 1px solid var(--filo); border-radius: 22px; padding: 2px; }
#livelli button { height: 40px; padding: 0 11px; border-radius: 20px; font: 500 12.5px/1 var(--sans); color: var(--tenue); }
#livelli button[aria-current="true"] { background: rgba(246,231,189,.14); color: var(--luce); }
#salto { margin-left: auto; }
#salto .sg { color: var(--luce); margin-right: 6px; }
#filo { display: flex; align-items: center; gap: 6px; margin-top: 6px; overflow-x: auto; scrollbar-width: none; font: 500 12.5px/1 var(--sans); color: var(--tenue); white-space: nowrap; }
#filo:empty { display: none; }
#filo::-webkit-scrollbar { display: none; }
#filo .nome { color: var(--testo); padding: 0 2px; min-height: 32px; display: inline-flex; align-items: center; }
#filo .trat { opacity: .5; }
#filo .via { margin-left: 2px; min-width: 32px; min-height: 32px; color: var(--tenue); }

#ultima { position: fixed; left: 0; top: 0; z-index: 4; max-width: min(300px, 78vw); text-align: left; padding: 10px 14px 11px; border-radius: 12px;
  background: rgba(10,15,28,.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid var(--filo); min-height: 44px; }
#ultima[hidden] { display: none; }
#ultima .data { display: block; font: 500 11.5px/1.3 var(--sans); color: var(--tenue); margin-bottom: 2px; }
#ultima em { font-size: 17px; line-height: 1.3; color: var(--testo); }
#ultima .sg { color: var(--luce); font-size: 12px; }
/* il dock */
#dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 0 0 max(6px, env(safe-area-inset-bottom));
  background: linear-gradient(rgba(10,15,28,0), var(--notte) 34%); }
#servizio { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 4px; font: 400 13px/1.35 var(--sans); color: var(--tenue); }
#servizio b { color: var(--testo); font-weight: 500; }
#servizio button { margin-left: auto; font: 500 13px/1 var(--sans); color: var(--luce); min-height: 36px; padding: 0 2px; white-space: nowrap; }
.fila { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 6px 16px; scroll-padding: 16px; }
.fila::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--filo); background: rgba(236,229,211,.05);
  font: 500 13.5px/1 var(--sans); color: var(--testo); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.chip .n { color: var(--tenue); font-weight: 400; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--luce); color: #18140a; border-color: var(--luce); }
.chip[aria-pressed="true"] .n { color: #5a4f33; }
.chip .sg { font-size: 13px; }
.chip.prop { color: #c3c8d3; }
.chip .forma { width: 14px; height: 14px; flex: none; }
#assi { display: flex; gap: 0; padding: 2px 6px 0; overflow-x: auto; scrollbar-width: none; }
#assi::-webkit-scrollbar { display: none; }
#assi button { flex: 1 0 auto; min-height: 44px; padding: 0 7px; font: 500 13.5px/1 var(--sans); color: var(--tenue); border-bottom: 2px solid transparent; position: relative; }
#assi button[aria-expanded="true"] { color: var(--testo); border-bottom-color: var(--luce); }
#assi button.attivo::after { content: ""; position: absolute; top: 9px; right: 3px; width: 6px; height: 6px; border-radius: 3px; background: var(--luce); }
#assi .sg { color: #9aa3b6; font-size: 13px; margin-left: 3px; }
#attivi { padding-top: 0; padding-bottom: 2px; }
#attivi[hidden] { display: none; }
#attivi .via { flex: none; min-height: 36px; padding: 0 12px; border-radius: 18px; background: rgba(246,231,189,.14); color: var(--luce); font: 500 13px/1 var(--sans); white-space: nowrap; }
#tempo { display: flex; align-items: center; gap: 10px; padding: 4px 16px; }
#tempo[hidden], #valori[hidden] { display: none; }
#gioca { flex: none; }
#mese { flex: 1; min-width: 0; height: 44px; accent-color: var(--luce); }
#meseL { flex: none; min-width: 100px; text-align: right; font: 500 13px/1.25 var(--sans); color: var(--testo); }
#meseL small { display: block; color: var(--tenue); font-weight: 400; font-size: 11.5px; }

/* il foglio */
#foglio { position: fixed; z-index: 8; left: 0; right: 0; bottom: 0; max-height: 54vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--vetro2); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--filo); border-radius: 18px 18px 0 0; padding: 6px 20px max(24px, env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 40px rgba(0,0,0,.45); }
#foglio.aperto { transform: none; }
.maniglia { width: 40px; height: 4px; border-radius: 2px; background: var(--filo); margin: 4px auto 6px; }
#chiudi { position: absolute; top: 4px; right: 6px; width: 44px; height: 44px; font-size: 22px; color: var(--tenue); font-family: var(--sans); }
.occhiello { font: 500 12px/1.3 var(--sans); letter-spacing: .04em; color: var(--tenue); display: flex; align-items: center; gap: 7px; margin: 6px 44px 2px 0; }
.occhiello svg { width: 16px; height: 16px; flex: none; }
#foglio h2 { font-weight: 500; font-size: 27px; line-height: 1.12; margin: 2px 40px 4px 0; letter-spacing: -.01em; }
#foglio h2 .sg { font-size: 17px; vertical-align: 3px; margin-left: 4px; color: var(--luce); }
#foglio h2 .sg.p { color: var(--prop); }
.meta { font: 400 13.5px/1.4 var(--sans); color: var(--tenue); margin: 0 0 14px; }
.frase { margin: 0 0 14px; }
.frase .data { display: block; font: 500 12px/1.3 var(--sans); color: var(--tenue); letter-spacing: .02em; margin-bottom: 3px; }
.frase em { font-size: 21px; line-height: 1.32; }
.frase .sg { color: var(--luce); margin-left: 4px; font-size: 14px; }
.altre { list-style: none; padding: 0; margin: 0 0 12px; border-top: 1px solid var(--filo); }
.altre li { padding: 9px 0 7px; border-bottom: 1px solid var(--filo); }
.altre .data { font: 500 11.5px/1.3 var(--sans); color: var(--tenue); display: block; margin-bottom: 1px; }
.altre em { font-size: 16.5px; }
.altre .sg { color: var(--luce); font-size: 12px; margin-left: 3px; }
.nota-r { font: 400 12.5px/1.35 var(--sans); color: var(--tenue); margin: 0 0 2px; }
.seme { font-size: 15px; color: #d9d2c0; margin: 6px 0 14px; padding-left: 12px; border-left: 1px solid var(--filo); }
.seme .sg { color: var(--luce); }
.mondo-r { font-size: 15.5px; margin: 0 0 14px; color: var(--mondo); }
.mondo-r .luogo { display: block; font: 400 12.5px/1.35 var(--sans); color: var(--tenue); margin-top: 2px; }
.mondo-r .sg { color: var(--mondo); }
.avviso { font: 400 13.5px/1.4 var(--sans); color: #e8c58a; margin: 0 0 14px; }
.prop-r { font: 400 14px/1.4 var(--serif); color: #aab1c0; margin: 0 0 12px; }
.prop-r .sg { color: var(--prop); }
.acc-r .sg { color: var(--luce); }
.tutte { font: 500 13px/1 var(--sans); color: var(--luce); min-height: 44px; padding: 0; }
#foglio h3 { font: 500 12px/1 var(--sans); letter-spacing: .06em; color: var(--tenue); margin: 16px 0 8px; font-variant-caps: all-small-caps; font-size: 14px; }
.vicini { display: flex; flex-wrap: wrap; gap: 8px; }
.vicini .chip { min-height: 44px; }

/* elenco e legenda */
.velo { position: fixed; inset: 0; z-index: 9; background: rgba(4,6,12,.55); display: none; }
.velo.aperto { display: block; }
.pannello { position: fixed; z-index: 10; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(560px, calc(100% - 24px)); max-height: 82vh;
  overflow: auto; background: var(--vetro2); border: 1px solid var(--filo); border-radius: 16px; padding: 16px 18px 18px; display: none; }
.pannello.aperto { display: block; }
.pannello h2 { font-weight: 500; font-size: 20px; margin: 0 0 10px; }
.pannello .x { position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; font: 22px var(--sans); color: var(--tenue); }
#cerca { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--filo); background: rgba(236,229,211,.05); color: var(--testo);
  font: 400 16px var(--sans); padding: 0 12px; margin-bottom: 10px; }
#lista h3 { font: 500 13px/1 var(--sans); color: var(--tenue); font-variant-caps: all-small-caps; letter-spacing: .06em; font-size: 15px; margin: 14px 0 4px; }
#lista button { display: flex; width: 100%; text-align: left; min-height: 44px; align-items: center; gap: 10px; border-bottom: 1px solid var(--filo); font-size: 16px; }
#lista button .n { margin-left: auto; font: 400 12.5px var(--sans); color: var(--tenue); }
#lista button.spento { opacity: .45; }
.leg { list-style: none; padding: 0; margin: 0; font: 400 14px/1.4 var(--sans); }
.leg li { display: flex; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--filo); }
.leg .k { width: 30px; text-align: center; flex: none; font-size: 18px; }
.leg svg { width: 24px; height: 24px; }
.leg small { color: var(--tenue); }

/* il desktop: il foglio diventa una scheda di lato */
@media (min-width: 900px) {
  #foglio { left: auto; top: 64px; bottom: 12px; right: 12px; width: 400px; max-height: none; border-radius: 16px; border: 1px solid var(--filo);
    transform: translateX(110%); padding: 14px 24px 24px; }
  #foglio .maniglia { display: none; }
  #testa { padding-left: 20px; padding-right: 20px; }
  #dock { padding-left: 8px; padding-right: 8px; }
  #dock.stretto { right: 424px; }
  .frase em { font-size: 23px; }
  #assi { justify-content: flex-start; }
  #assi button { flex: 0 0 auto; padding: 0 16px; }
}
@media (prefers-reduced-motion: reduce) { #foglio { transition: none; } }
</style>
</head>
<body>
<canvas id="cielo" role="img" aria-label="Il cielo dei concetti: una mappa. L'elenco testuale è nel tasto Elenco."></canvas>

<button id="ultima" hidden aria-label="La tua frase più recente"></button>
<header id="testa">
  <div class="riga1">
    <span class="marchio"><b>Mnemosyne</b><span class="sub"> · il cielo</span></span>
    <button class="tasto" id="apriElenco" aria-haspopup="dialog" title="Elenco e ricerca">Elenco</button>
    <button class="tasto" id="apriLegenda" aria-haspopup="dialog" aria-label="Legenda dei segni">?</button>
    <button class="tasto" id="lente" aria-pressed="false" title="anche le mie proposte"><span class="sg">◌</span>&nbsp;proposte</button>
  </div>
  <div class="riga2">
    <div id="livelli" role="group" aria-label="Distanza">
      <button data-l="1">regioni</button><button data-l="2">temi</button><button data-l="3">nomi</button><button data-l="4">frasi</button>
    </div>
    <button class="tasto" id="salto" title="Una stella a caso"><span class="sg">✦</span>salto</button>
  </div>
  <div id="filo" aria-label="Il filo: i nodi che hai visitato"></div>
</header>

<div id="dock">
  <div id="servizio" aria-live="polite"></div>
  <div id="attivi" class="fila" hidden aria-label="Filtri attivi"></div>
  <div id="valori" class="fila" hidden role="group"></div>
  <div id="tempo" hidden>
    <button class="tasto" id="gioca" aria-label="Fai nascere le stelle mese per mese">▷</button>
    <input type="range" id="mese" min="0" max="14" step="1" aria-label="Fino a quale mese">
    <span id="meseL"></span>
  </div>
  <nav id="assi" aria-label="Filtri sugli assi"></nav>
</div>

<aside id="foglio" role="dialog" aria-label="Scheda del nodo"><div class="maniglia"></div><button id="chiudi" aria-label="Chiudi">×</button><div id="foglioC"></div></aside>

<div class="velo" id="velo"></div>
<section class="pannello" id="elenco" role="dialog" aria-label="Elenco" aria-modal="true">
  <button class="x" data-chiudi aria-label="Chiudi">×</button>
  <h2>Elenco</h2>
  <input id="cerca" type="search" placeholder="la parola, alla lettera" autocomplete="off" aria-label="Cerca un nome o una parola">
  <div id="lista"></div>
</section>
<section class="pannello" id="legenda" role="dialog" aria-label="Legenda" aria-modal="true">
  <button class="x" data-chiudi aria-label="Chiudi">×</button>
  <h2>Come si legge il cielo</h2>
  <ul class="leg" id="legL"></ul>
</section>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
'use strict';
/* =====================================================================
   DATI SINTETICI. Inventati per il prototipo: nessun dato del repository.
   Nessun frammento delicato, nessuna persona «cerchia: vita».
   ===================================================================== */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry32(20261105);
const pick = (a) => a[Math.floor(R() * a.length)];
const USATI = {}; // un modello una volta sola per nodo
function modello(id, xs) { const u = USATI[id] ||= new Set(); let c = xs.filter((x) => !u.has(x)); if (!c.length) return null; const m = pick(c); u.add(m); return m; }

// I mesi: 0 = l'archivio d'origine (entro il 12 settembre 2025), poi da ottobre 2025 a novembre 2026.
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const MS = ['origine']; for (let i = 0; i < 14; i++) { const y = 2025 + Math.floor((9 + i) / 12), m = (9 + i) % 12; MS.push(`${y}-${String(m + 1).padStart(2, '0')}`); }
const meseL = (i) => i === 0 ? 'archivio d’origine' : `${MESI[+MS[i].slice(5) - 1]} ${MS[i].slice(0, 4)}`;
const TETTO = '2025-09-12';

// Le specie dei temi e i campi: vocabolari chiusi (dimensioni.md §1.4, §1.5). Sono scelte di "consolida": ◌.
const SPECIE = { stato: 'sentimenti', idea: 'idee', domanda: 'domande', simbolo: 'simboli', corrente: 'correnti', stile: 'stili' };
const SPECIE1 = { stato: 'sentimento', idea: 'idea', domanda: 'domanda', simbolo: 'simbolo', corrente: 'corrente', stile: 'stile' };
const CAMPI = ['filosofia','psicologia','mito-e-religione','esoterismo','scienza','storia','letteratura','arte','musica','cinema'];
const TIPI = ['canzone','album','libro','poesia','film','serie','fumetto','spettacolo','immagine','gioco','video'];
const GESTI = ['penso','sento','chiedo','ricordo','voglio fare','trascrivo'];
const nomeCampo = (c) => c.replace(/-/g, ' ');

// I colori. Tinte quiete su notte; nessun rosso. La luce (alfa e grandezza) dice quante volte l'hai detto.
const COL_SPECIE = { stato: '#f6cfa6', idea: '#f8ebc4', domanda: '#eef0f3', simbolo: '#e4e8cf', corrente: '#ece0e8', stile: '#bdbdb8' };
const COL_CAMPO = { filosofia: '#d8b874', psicologia: '#d49aa8', 'mito-e-religione': '#a894d4', esoterismo: '#86b0a0', scienza: '#78b0d0',
  storia: '#bea27e', letteratura: '#9ab6d8', arte: '#d4a07e', musica: '#a8c884', cinema: '#bcaee0' };

// [slug, nome, specie, peso ✦, campo?]
const TEMI = [
  ['malinconia','malinconia','stato',10],['rabbia','rabbia','stato',5],['quiete','quiete','stato',6],['nostalgia','nostalgia','stato',7],
  ['stanchezza','stanchezza','stato',5],['gioia','gioia','stato',4],['paura','paura','stato',3],['tenerezza','tenerezza','stato',3],
  ['noia','noia','stato',2],['vergogna','vergogna','stato',2],
  ['attenzione','attenzione','idea',13],['aspettare','aspettare','idea',8],['dolore','dolore','idea',6],['tempo','tempo','idea',8],
  ['liberta','libertà','idea',5],['memoria','memoria','idea',7],['silenzio','silenzio','idea',6],['corpo','corpo','idea',4],
  ['verita','verità','idea',3],['lentezza','lentezza','idea',5],['gratitudine','gratitudine','idea',2],
  ['serve-ricordare','a che cosa serve ricordare?','domanda',3],['resta-giorno','che cosa resta di un giorno?','domanda',3],
  ['senza-paura','chi sarei senza paura?','domanda',2],['perche-rimando','perché rimando?','domanda',3],['casa-q','che cosa vuol dire casa?','domanda',4],
  ['mare','mare','simbolo',9],['faro','faro','simbolo',4],['porta','porta','simbolo',4],['luna','luna','simbolo',3],['fiume','fiume','simbolo',3],
  ['chiave','chiave','simbolo',3],['fenice','fenice','simbolo',2],['finestra','finestra','simbolo',2],['treno','treno','simbolo',3],
  ['stoicismo','stoicismo','corrente',5,['filosofia']],['epicureismo','epicureismo','corrente',3,['filosofia']],['esistenzialismo','esistenzialismo','corrente',3,['filosofia']],
  ['romanticismo','romanticismo','corrente',2,['letteratura']],['wabi-sabi','wabi sabi','corrente',3,['arte']],['zen','zen','corrente',2,['mito-e-religione']],
  ['linea','linea','stile',5],['blackwork','blackwork','stile',2],['dotwork','dotwork','stile',2],
];
// I temi dedotti (◌): letture mie, spente di default. «soglia» è stata accolta: ●.
const TEMI_PROP = [
  ['solitudine','solitudine','stato',['mare','faro','il-cielo-sopra-berlino']],['cura','cura','idea',['attenzione','donald-winnicott']],
  ['ritorno','ritorno','idea',['orfeo','nostalgia']],['ascolto','ascolto','idea',['attenzione','silenzio']],
  ['impermanenza','impermanenza','idea',['wabi-sabi','fiume','tempo']],['desiderio','desiderio','stato',['stalker']],
  ['radici','radici','simbolo',['casa-q','still-walking']],['ombra','ombra','simbolo',['carl-gustav-jung']],
  ['soglia','soglia','simbolo',['porta','stalker','orfeo'],'acc'],
];

document.getElementById('servizio').addEventListener('click', (e) => { if (e.target.id === 'togli') { S.sel = {}; S.mese = 14; document.getElementById('mese').value = 14; ferma(); tutto(); } });
document.getElementById('lente').onclick = () => { S.lente = !S.lente; aggiornaLente(); tutto(); };
function aggiornaLente() { document.getElementById('lente').setAttribute('aria-pressed', String(S.lente)); }

/* ===== Il tempo: le stelle nascono nell'ordine in cui le hai nominate ===== */
const inM = document.getElementById('mese'); inM.value = 14;
function aggiornaMese() {
  const nate = NODI.filter((n) => n.voce !== 'prop' && n.nato <= S.mese).length;
  const nuove = NODI.filter((n) => n.voce !== 'prop' && n.nato === S.mese).length;
  document.getElementById('meseL').innerHTML = `${S.mese === 14 ? 'fino a oggi' : 'fino a ' + meseL(S.mese)}<small>${nate} stelle${nuove ? ` · ${nuove} nuove` : ''}</small>`;
}
function vaiMese(m) {
  const prima = S.mese; S.mese = m; inM.value = m;
  const ora = performance.now(); NODI.forEach((n) => { if (n.nato > prima && n.nato <= m) NATI.set(n.id, ora); });
  tutto();
}
inM.addEventListener('input', () => vaiMese(+inM.value));
let corsa = null;
function ferma() { clearInterval(corsa); corsa = null; document.getElementById('gioca').textContent = '▷'; }
document.getElementById('gioca').onclick = () => {
  if (corsa) { ferma(); return; }
  if (S.mese >= 14) vaiMese(0);
  document.getElementById('gioca').textContent = '❙❙';
  corsa = setInterval(() => { if (S.mese >= 14) { ferma(); return; } vaiMese(S.mese + 1); }, RIDOTTO ? 1600 : 1100);
};

/* ===== Elenco (l'alternativa testuale) e legenda ===== */
function apriPannello(id) { document.getElementById('velo').classList.add('aperto'); document.getElementById(id).classList.add('aperto'); if (id === 'elenco') { lista(); document.getElementById('cerca').focus(); } }
function chiudiPannelli() { document.getElementById('velo').classList.remove('aperto'); document.querySelectorAll('.pannello').forEach((p) => p.classList.remove('aperto')); }
document.getElementById('apriElenco').onclick = () => apriPannello('elenco');
document.getElementById('apriLegenda').onclick = () => apriPannello('legenda');
document.getElementById('velo').onclick = chiudiPannelli;
document.querySelectorAll('[data-chiudi]').forEach((b) => (b.onclick = chiudiPannelli));
const norm = (s) => s.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
function lista() {
  const q = norm(document.getElementById('cerca').value.trim());
  const gruppi = [['tema', 'temi'], ['opera', 'opere'], ['persona', 'persone'], ['citazione', 'citazioni'], ['raccolta', 'raccolte']];
  let h = '';
  // la parola cerca anche nelle frasi, alla lettera
  const perFrase = q.length >= 3 ? new Set(F.flatMap((f, i) => (norm(f.testo).includes(q) ? [...VAL[0][i].nodi] : []))) : new Set();
  for (const [g, nome] of gruppi) {
    const xs = NODI.filter((n) => n.genere === g && visibile(n) && (!q || norm(n.nome).includes(q) || perFrase.has(n.id))).sort((a, b) => quante(b) - quante(a));
    if (!xs.length) continue;
    h += `<h3>${nome}</h3>` + xs.map((n) => `<button data-va="${n.id}" class="${ACCESI && !ACCESI.has(n.id) ? 'spento' : ''}"><span style="color:${colore(n)};display:inline-flex;width:16px">${n.voce === 'prop' ? ICONA.prop : ICONA[n.genere]}</span>${esc(n.genere === 'citazione' ? '«' + n.nome + '»' : n.nome)}${n.voce === 'prop' ? ' <span class="sg" style="color:var(--prop)">◌</span>' : ''}${n.genere === 'citazione' && !n.esito ? ' <span class="vf">⚠</span>' : ''}<span class="n">${quante(n) || ''}</span></button>`).join('');
  }
  document.getElementById('lista').innerHTML = h || '<p style="color:var(--tenue);font:400 14px var(--sans)">Niente, alla lettera.</p>';
}
document.getElementById('cerca').addEventListener('input', lista);
document.getElementById('lista').addEventListener('click', (e) => { const b = e.target.closest('[data-va]'); if (b) { chiudiPannelli(); apri(b.dataset.va); } });
document.getElementById('legL').innerHTML = [
  ['<span class="sg" style="color:var(--luce)">✦</span>', 'tue: le tue parole, e ciò che nomini', 'la luce e la grandezza dicono quante volte'],
  ['<span class="sg" style="color:var(--luce)">✧</span>', 'seme', 'dall’archivio d’origine, sempre a parte'],
  ['<span class="sg" style="color:var(--luce)">●</span>', 'accolte', 'una mia proposta che hai preso'],
  ['<span class="sg" style="color:var(--prop)">◌</span>', 'mie: proposte, spente di default', 'tratteggiate, più quiete; il campo e la specie sono ◌'],
  ['<span class="sg" style="color:var(--mondo)">○</span>', 'mondo', 'sempre con opera e passo'],
  ['<span class="vf">⚠</span>', 'da verificare', 'un triangolo ambra, mai nascosto'],
  [`<span style="color:${COL_SPECIE.idea}">${ICONA.tema}</span>`, 'stella: un tema', 'il colore è la specie (sentimento, idea, domanda…)'],
  [`<span style="color:${COL_CAMPO.letteratura}">${ICONA.opera}</span>`, 'disco: un’opera', 'dentro, il segno del tipo: canzone, libro, film…'],
  [`<span style="color:${COL_CAMPO.filosofia}">${ICONA.persona}</span>`, 'anello: una persona', 'sottile e con un punto dentro se è un personaggio'],
  [`<span style="color:#d8d2c2">${ICONA.citazione}</span>`, 'rombo: una citazione', ''],
  [`<span style="color:#e6dfcd">${ICONA.raccolta}</span>`, 'esagono: una raccolta', ''],
  ['<span style="color:var(--tenue);font:600 11px var(--sans);letter-spacing:.1em">ARTE</span>', 'le regioni sono il campo ◌', 'il centro sono le tue parole; vicino vuol dire legato'],
].map(([k, a, b]) => `<li><span class="k">${k}</span><span>${a}${b ? `<br><small>${b}</small>` : ''}</span></li>`).join('');

/* ===== L'indirizzo ===== */
function scriviIndirizzo() {
  const p = new URLSearchParams(); if (S.nodo) p.set('nodo', S.nodo); if (S.lente) p.set('lente', 'proposte');
  for (const a in S.sel) if (S.sel[a].size) p.set(a, [...S.sel[a]].join(',')); if (S.mese < 14) p.set('fino', MS[S.mese]);
  history.replaceState(null, '', p.toString() ? '#' + p.toString() : location.pathname + location.search);
}
function leggiIndirizzo() {
  const p = new URLSearchParams(location.hash.slice(1));
  S.lente = p.get('lente') === 'proposte'; aggiornaLente();
  for (const a of ASSI) if (p.get(a.k)) S.sel[a.k] = new Set(p.get(a.k).split(','));
  if (p.get('fino')) { const m = MS.indexOf(p.get('fino')); if (m >= 0) { S.mese = m; inM.value = m; } }
  if (p.get('aperto')) S.aperto = p.get('aperto');
  return p.get('nodo');
}

/* ===== Avvio ===== */
function avvio() {
  misura(); const z0 = +new URLSearchParams(location.hash.slice(1)).get('zoom'); const n0 = leggiIndirizzo(); tutto();
  T = adatta(); sCv.call(zoom.transform, T); if (filtri()) { const d = RIDOTTO; inquadra(); }
  if (n0 && N[n0]) apri(n0);
  if (z0) { const z = z0; const c = T.invert([W / 2, H / 2]); const { top, bottom } = insets(); sCv.call(zoom.transform, d3.zoomIdentity.translate(W / 2, top + (H - top - bottom) / 2).scale(KFIT * z).translate(-c[0], -c[1])); }
  pianifica();
  if (!RIDOTTO) (function giro(t) { disegna(t); requestAnimationFrame(giro); })(performance.now());
}
addEventListener('resize', () => { const r = rel(); misura(); const t0 = adatta(); KFIT = t0.k; pianifica(); });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(avvio);
window.__cielo = { N, F, NODI, S, apri, vaiMese, tutto };
