<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mnemosyne</title>
<script>
  // Lo script anti-lampo (atlante-sito §5.1): il tema segue il sistema; ?tema= serve solo alle foto del prototipo.
  (function () {
    var t = new URLSearchParams(location.search).get('tema');
    if (t === 'scuro') document.documentElement.dataset.theme = 'dark';
    if (t === 'chiaro') document.documentElement.dataset.theme = 'light';
    var s = 1; try { var v = localStorage.getItem('mn-strato'); if (v !== null) s = +v; } catch (e) {}
    document.documentElement.dataset.strato = String(s);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
<style>
:root {
  --carta: #f5f1e8; --campo: #ebe5d8; --inchiostro: #1c1a17; --tenue: #6a645a; --filo: #d9d1c1; --velo: rgba(28,26,23,.06);
  --sotto: #fbf8f2; --ombra: 0 -8px 30px rgba(0,0,0,.12);
  --corpo: 18px; --misura: 34em;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #151412; --campo: #0c0b0a; --inchiostro: #e8e2d6; --tenue: #9b9488; --filo: #2e2b27; --velo: rgba(232,226,214,.06);
    --sotto: #1d1b18; --ombra: 0 -8px 30px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #151412; --campo: #0c0b0a; --inchiostro: #e8e2d6; --tenue: #9b9488; --filo: #2e2b27; --velo: rgba(232,226,214,.06);
  --sotto: #1d1b18; --ombra: 0 -8px 30px rgba(0,0,0,.5); color-scheme: dark;
}
@media (min-width: 900px) { :root { --corpo: 20px; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--carta); color: var(--inchiostro);
  font: 400 var(--corpo)/1.45 "Source Serif 4", "Iowan Old Style", Georgia, serif;
  font-optical-sizing: auto; font-variant-numeric: oldstyle-nums proportional-nums;
  -webkit-font-smoothing: antialiased; padding-bottom: 72px;
}
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .18em; text-decoration-color: var(--filo); }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--inchiostro); outline-offset: 3px; }
.pagina { max-width: var(--misura); margin: 0 auto; padding: 0 16px; }
.larga { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.testa { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 0 6px; }
.marchio, .sc { font-variant-caps: all-small-caps; letter-spacing: .07em; font-size: .82em; color: var(--tenue); }
.marchio { text-decoration: none; }
h1 { font-weight: 500; font-size: 1.55em; line-height: 1.15; margin: .5em 0 .15em; font-variation-settings: "opsz" 48; letter-spacing: -.005em; }
h2 { font-weight: 500; font-size: .82em; font-variant-caps: all-small-caps; letter-spacing: .08em; color: var(--tenue); margin: 2.2em 0 .6em; }
p { margin: 0 0 .8em; }
.servizio { color: var(--tenue); font-size: .88em; }
.legenda { color: var(--tenue); font-size: .8em; margin: 0 0 1.4em; }

/* I segni: peso tipografico, mai colore d'allarme */
.sg { font-family: "Noto Sans Symbols 2", "Segoe UI Symbol", sans-serif; font-style: normal; font-size: .7em; vertical-align: .12em; }
.righe a, .frase a, .porta, .pezzo a { text-decoration: none; }
body.foto .barra { position: static; }
.foglio { visibility: hidden; }
body.aperto .foglio { visibility: visible; }
.sua { font-style: italic; }
.sua .sg, .seme .sg, .acc .sg { color: var(--inchiostro); }
.seme { font-style: italic; }
.prop, .prop .sg { color: var(--tenue); font-weight: 350; }
.mondo { }
.mondo .sg { color: var(--tenue); }
.luogo { display: block; font-size: .78em; color: var(--tenue); font-style: normal; margin-top: .15em; }
.vf { font-size: .62em; vertical-align: .3em; margin-left: .2em; font-family: "Noto Sans Symbols 2", sans-serif; }
.data { display: block; font-size: .78em; color: var(--tenue); font-variant-numeric: lining-nums; letter-spacing: .01em; margin-bottom: .1em; }
.nota-r { display: block; font-size: .78em; color: var(--tenue); margin: 1.2em 0 .2em; }

/* Strati: 0 = mie, 1 = e accolte, 2 = e proposte */
[data-strato="0"] .l1, [data-strato="0"] .l2, [data-strato="1"] .l2 { display: none; }
[data-strato="2"] .nascosti { display: none; }
.strati { display: inline-flex; border: 1px solid var(--filo); border-radius: 999px; padding: 2px; font-size: .74em; margin: .3em 0 1.2em; }
.strati button { all: unset; cursor: pointer; padding: .35em .8em; border-radius: 999px; color: var(--tenue); min-height: 28px; line-height: 28px; padding-top: 0; padding-bottom: 0; }
[data-strato="0"] .strati [data-s="0"], [data-strato="1"] .strati [data-s="1"], [data-strato="2"] .strati [data-s="2"] { background: var(--inchiostro); color: var(--carta); }
.strati button:focus-visible { outline: 2px solid var(--inchiostro); }
.nascosti { all: unset; cursor: pointer; color: var(--tenue); font-size: .82em; display: block; padding: .6em 0; }

/* La soglia */
.soglia { min-height: calc(100svh - 120px); display: flex; flex-direction: column; justify-content: flex-start; padding-top: 11svh; }
.soglia .quando { font-size: .82em; color: var(--tenue); margin: 2.2em 0 1.6em; }
.coppia { margin: 0; }
.coppia .frase { font-size: 1.32em; line-height: 1.3; font-variation-settings: "opsz" 36; margin: 0; }
.intervallo { display: flex; align-items: center; gap: .7em; margin: 1.2em 0; color: var(--tenue); font-size: .74em; }
.intervallo::before { content: ""; width: 1px; height: 3.2em; background: var(--filo); margin-left: .2em; }
.respiro { opacity: 0; animation: respiro .9s ease-out .7s forwards; }
@keyframes respiro { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .respiro { animation: none; opacity: 1; } }
.apri { display: inline-block; margin-top: 1.6em; font-size: .9em; }
.porte { margin-top: 1em; padding: 2.4em 0 1.5em; border-top: 1px solid var(--filo); display: grid; grid-template-columns: 1fr 1fr; gap: 1.1em 1em; }
.porta { text-decoration: none; display: block; min-height: 44px; }
.porta b { display: block; font-weight: 500; font-size: .95em; }
.porta span { display: block; font-size: .74em; color: var(--tenue); font-style: italic; line-height: 1.35; margin-top: .15em; }
.porta span.r { font-style: normal; }

/* Liste di frasi */
.righe { list-style: none; padding: 0; margin: 0; }
.righe li { padding: .7em 0; border-bottom: 1px solid var(--velo); }
.righe li:last-child { border-bottom: 0; }
.righe a { text-decoration: none; }
.numerate { list-style: decimal; padding-left: 1.6em; }
.numerate li::marker { color: var(--tenue); font-size: .8em; font-variant-numeric: lining-nums; }
.mese { margin-top: 2em; }
.mese > h2 { margin-top: 0; }
.coda::after { content: "da tempo"; font-size: .62em; font-variant-caps: all-small-caps; letter-spacing: .08em; color: var(--tenue); margin-left: .6em; font-style: normal; }
.delic { all: unset; cursor: pointer; color: var(--tenue); font-size: .82em; padding: .7em 0; display: block; }

/* La restituzione come tavola */
.tavola-r { background: var(--campo); margin: 0 -16px; padding: 22px 16px 26px; }
.voce { display: grid; grid-template-columns: 2.1em 1fr; gap: 0 .3em; padding: .55em 0; }
.num { all: unset; cursor: pointer; font-variant-numeric: lining-nums tabular-nums; font-size: .8em; width: 1.9em; height: 1.9em; border: 1px solid var(--filo); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-top: .1em; background: var(--carta); }
.num:focus-visible { outline: 2px solid var(--inchiostro); }
.affiancate { display: grid; gap: 1.1em; margin: .4em 0 1.2em; }
@media (min-width: 900px) { .affiancate { grid-template-columns: 1fr 1fr; gap: 2em; } }
.affiancate .frase { font-size: 1.12em; line-height: 1.32; }
.chiusa { margin-top: 1.2em; }

/* Il foglio dal basso */
.velo { position: fixed; inset: 0; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.foglio { position: fixed; left: 0; right: 0; bottom: 0; background: var(--sotto); box-shadow: var(--ombra); border-radius: 14px 14px 0 0; padding: 10px 16px 28px; transform: translateY(105%); transition: transform .22s cubic-bezier(.2,.8,.2,1); z-index: 21; max-height: 78svh; overflow: auto; }
.foglio .maniglia { width: 36px; height: 4px; border-radius: 2px; background: var(--filo); margin: 0 auto 12px; }
body.aperto .velo { opacity: 1; pointer-events: auto; }
body.aperto .foglio { transform: none; }
@media (min-width: 900px) { .foglio { left: auto; right: 24px; bottom: 24px; width: 420px; border-radius: 14px; } }
@media (prefers-reduced-motion: reduce) { .foglio, .velo { transition: none; } }
.gesti { display: grid; gap: .5em; margin-top: 1em; }
.gesto { display: block; text-decoration: none; border: 1px solid var(--filo); border-radius: 10px; padding: .6em .8em; min-height: 44px; }
.gesto b { font-weight: 500; font-size: .9em; }
.gesto code { display: block; font: .7em/1.4 ui-monospace, Menlo, monospace; color: var(--tenue); margin-top: .2em; word-break: break-all; }

/* Il nodo */
.conto { font-size: .78em; color: var(--tenue); font-variant-numeric: lining-nums; }
.incrocio { margin: 1.4em 0 1.6em; }
.nomi-x { display: flex; align-items: center; gap: .6em; font-variant-caps: all-small-caps; letter-spacing: .07em; font-size: .9em; margin: 0 0 .6em; color: var(--tenue); }
.nomi-x a { text-decoration: none; color: var(--inchiostro); }
.nomi-x .x { flex: 1; border-top: 1px solid var(--inchiostro); }
.frase.grande { font-size: 1.28em; line-height: 1.3; font-variation-settings: "opsz" 36; margin: 0; }
.conv { border-left: 1px solid var(--filo); padding-left: 1em; margin: .6em 0 1em; }
.binari { display: grid; grid-template-columns: 1fr 1fr; gap: .2em 1em; font-size: .86em; margin-top: 1em; }
.binari a { display: block; padding: .5em 0; min-height: 44px; text-decoration: none; }
.binari small { display: block; color: var(--tenue); font-size: .8em; }
details { margin: .4em 0; }
summary { cursor: pointer; color: var(--tenue); font-size: .86em; padding: .5em 0; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "＋ "; font-size: .8em; }
details[open] summary::before { content: "－ "; }
.corpo { font-size: 1.18em; line-height: 1.4; margin: .2em 0 .6em; white-space: pre-wrap; }

/* La tavola del nodo: zoom semantico */
.tela { position: relative; background: var(--campo); margin: 0 -16px; overflow: hidden; touch-action: manipulation; }
.tela svg { display: block; width: 100%; height: auto; transition: transform .32s cubic-bezier(.2,.8,.2,1); transform-origin: 50% 50%; }
@media (prefers-reduced-motion: reduce) { .tela svg { transition: none; } }
.tela text { fill: var(--inchiostro); font-family: "Source Serif 4", Georgia, serif; }
.tela .t-tenue { fill: var(--tenue); }
.tela line { stroke: var(--filo); stroke-width: 1; }
.tela line.acceso { stroke: var(--inchiostro); }
.tela .n { cursor: pointer; }
.tela .n rect { fill: transparent; }
.tela .n:focus { outline: none; }
.tela .n:focus-visible rect { stroke: var(--inchiostro); }
.tela svg.zoomato .n:not(.sel) text { opacity: .3; }
.tela svg.zoomato .n.sel text { font-weight: 600; }
.livello { font-size: .78em; color: var(--tenue); margin: .8em 0; }

/* La tavola dei tatuaggi */
.campo-t { background: #11100e; color: #ece6da; margin: 0 -16px; padding: 18px 14px 26px; }
.campo-t .sc, .campo-t .legenda, .campo-t .servizio, .campo-t .data, .campo-t .luogo { color: #a39c90; }
.campo-t .sg { color: #ece6da; }
.pezzi { display: grid; grid-template-columns: repeat(6, 1fr); gap: 22px 14px; grid-auto-flow: dense; }
.pezzo { border: 1px solid #3a3631; padding: 12px; background: #191714; }
.pezzo.g { grid-column: span 6; }
.pezzo.m { grid-column: span 3; }
.pezzo.p { grid-column: span 3; padding: 10px; }
@media (min-width: 900px) { .pezzi { grid-template-columns: repeat(12, 1fr); gap: 34px 26px; } .pezzo.g { grid-column: span 5; grid-row: span 2; } .pezzo.m { grid-column: span 4; } .pezzo.p { grid-column: span 3; } }
.pezzo .frase { font-style: italic; line-height: 1.3; }
.pezzo.g .frase { font-size: 1.15em; }
.pezzo.m .frase { font-size: .92em; }
.pezzo.p .frase, .pezzo.p { font-size: .76em; }
.pezzo svg { width: 100%; height: auto; display: block; margin-bottom: 10px; }
.pezzo svg path, .pezzo svg circle, .pezzo svg line { stroke: #ece6da; fill: none; stroke-width: 1.4; }
.filo-t { grid-column: 1 / -1; display: flex; align-items: center; gap: .6em; font-size: .7em; color: #a39c90; letter-spacing: .03em; margin: -8px 0; }
.filo-t::before, .filo-t::after { content: ""; flex: 1; border-top: 1px dashed #3a3631; }
.margine { margin-top: 26px; padding-top: 14px; border-top: 1px solid #2a2723; color: #8f887c; font-size: .8em; font-weight: 350; }
.pin { font-style: normal !important; }
.pin a { color: #ece6da; }

/* Stampa: il brief */
@media print {
  body { background: #fff; color: #000; padding: 0; font-size: 12pt; }
  .barra, .testa .strumenti, .velo, .foglio, .no-stampa, .margine { display: none !important; }
  .campo-t { background: #fff; color: #000; margin: 0; padding: 0; }
  .campo-t .sc, .campo-t .legenda, .campo-t .data, .campo-t .luogo, .filo-t { color: #444; }
  .campo-t .sg, .pin a { color: #000; }
  .pezzo { background: #fff; border-color: #bbb; break-inside: avoid; }
  .pezzo svg path, .pezzo svg circle, .pezzo svg line { stroke: #000; }
}
.stampa-v .campo-t { background: #fff; color: #111; }
.stampa-v .pezzo { background: #fff; border-color: #c9c3b8; }
.stampa-v .pezzo svg path, .stampa-v .pezzo svg circle, .stampa-v .pezzo svg line { stroke: #111; }
.stampa-v .campo-t .sg, .stampa-v .pin a { color: #111; }
.stampa-v .campo-t .sc, .stampa-v .campo-t .legenda, .stampa-v .campo-t .data, .stampa-v .campo-t .luogo, .stampa-v .filo-t { color: #555; }

/* Cerca */
.campo-cerca { width: 100%; font: inherit; font-size: 1.05em; padding: .6em .8em; border: 1px solid var(--filo); border-radius: 10px; background: var(--sotto); color: var(--inchiostro); }
mark { background: none; color: inherit; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: .15em; }

/* Il tempo: quadratini tutti uguali, senza scala */
.nodo-soglia { padding-top: 6svh; min-height: 0; padding-bottom: .6em; }
.piede .strati { margin: .2em 0 0; font-size: .66em; }
.nodo-soglia h1 { margin-bottom: .25em; }
.giorni { display: grid; grid-template-columns: repeat(7, 14px); gap: 4px; margin: .4em 0 .8em; }
.giorni i { width: 14px; height: 14px; border: 1px solid var(--filo); border-radius: 2px; }
.giorni i.a { background: var(--inchiostro); border-color: var(--inchiostro); }
.giorni i.v { visibility: hidden; }
.lettore { display: flex; align-items: center; gap: .6em; font-size: .72em; color: var(--tenue); margin: 1em 0; }
.lettore::before, .lettore::after { content: ""; flex: 1; border-top: 1px dotted var(--filo); }
.pos { border-left: 1px solid var(--inchiostro); padding-left: .9em; margin: .6em 0 1em; }
@media (min-width: 900px) {
  .tempo-griglia { display: grid; grid-template-columns: 200px 1fr; gap: 0 40px; }
}


/* Esplora: la parola, le chip, l'indice, il foglio dei filtri */
.esp-testa { position: sticky; top: 0; z-index: 5; background: var(--carta); margin: 0 -16px; padding: 6px 16px 0; border-bottom: 1px solid var(--velo); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { all: unset; box-sizing: border-box; cursor: pointer; flex: none; display: inline-flex; align-items: center; gap: .5em; min-height: 44px; padding: 0 1em; border: 1px solid var(--filo); border-radius: 999px; font-size: .8em; white-space: nowrap; text-decoration: none; }
.chip.attivo { background: var(--inchiostro); color: var(--carta); border-color: var(--inchiostro); }
.chip.attivo.c-prop { background: var(--tenue); border-color: var(--tenue); }
.chip.da { border-color: var(--inchiostro); font-variant-caps: all-small-caps; letter-spacing: .05em; }
.chip span[aria-hidden] { opacity: .7; }
.chip:focus-visible { outline: 2px solid var(--inchiostro); outline-offset: 2px; }
.chip.filtra::before { content: "＋"; font-size: .9em; }
.totale { font-size: .78em; color: var(--tenue); margin: 1em 0 0; font-variant-numeric: lining-nums; }
.asse h2 { margin: 1.7em 0 .2em; }
.valori { margin: 0; line-height: 1.25; }
.valori a { display: inline-block; text-decoration: none; padding: .62em 0; margin-right: 1.05em; min-height: 44px; box-sizing: border-box; }
.valori.secondi { font-style: italic; }
.n { font-size: .66em; color: var(--tenue); margin-left: .32em; font-variant-numeric: lining-nums tabular-nums; vertical-align: .12em; font-style: normal; }
.asse-prop h2, .asse-prop .valori a, .f-asse.asse-prop h2 { color: var(--tenue); font-weight: 350; }
.perche { font-variant-caps: normal; letter-spacing: 0; font-size: 1.1em; font-weight: 350; }
.nomi { line-height: 1.5; margin: 0; }
.nomi a { display: inline-block; padding: .45em 0; }
.sep { color: var(--tenue); }
.vuoto { margin: 1.4em 0; }
.lente { margin: 2.4em 0 1em; border-top: 1px solid var(--velo); padding-top: .4em; }
.lente-b { all: unset; cursor: pointer; color: var(--tenue); font-size: .82em; min-height: 44px; display: inline-flex; align-items: center; }
.lente-b:focus-visible { outline: 2px solid var(--inchiostro); }
[data-strato="2"] .solo-l1 { display: none; }
.f-asse h2 { margin: 1.2em 0 .5em; }
.vals { display: flex; flex-wrap: wrap; gap: 8px; }
.val, .altri { all: unset; box-sizing: border-box; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; padding: 0 .9em; border: 1px solid var(--filo); border-radius: 999px; font-size: .84em; }
.val.on { background: var(--inchiostro); color: var(--carta); border-color: var(--inchiostro); }
.val.on .n { color: inherit; opacity: .75; }
.val:focus-visible, .altri:focus-visible, .mostra:focus-visible { outline: 2px solid var(--inchiostro); outline-offset: 2px; }
.val.oltre { display: none; }
.vals.tutti .val.oltre { display: inline-flex; }
.altri { color: var(--tenue); border-style: dashed; }
.f-piede { position: sticky; bottom: -28px; background: var(--sotto); padding: 14px 0 6px; margin-top: 1.2em; }
.mostra { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; text-align: center; min-height: 48px; line-height: 48px; border-radius: 12px; background: var(--inchiostro); color: var(--carta); font-size: .92em; }
/* Il nodo: le faccette e l'intorno */
.faccette { font-size: .84em; color: var(--tenue); margin: 0 0 2em; line-height: 1.6; }
.faccette a { color: var(--inchiostro); display: inline-block; padding: .3em 0; }
.intorno { margin: 0 0 .3em; line-height: 1.45; display: grid; grid-template-columns: 5.6em 1fr; align-items: baseline; }
.intorno > span:not(.t), .intorno > a { grid-column: 2; }
.intorno .vs { grid-column: 2; }
.intorno .t, .raccordi .t { display: inline-block; min-width: 5.4em; font-variant-caps: all-small-caps; letter-spacing: .07em; font-size: .8em; color: var(--tenue); }
.intorno a { display: inline-block; padding: .5em 0; }
.raccordi { font-size: .86em; line-height: 1.5; margin: 1em 0; }
.raccordi a { display: inline-block; padding: .5em 0; }
.piede-n { margin-top: 2.4em; }
/* Barra in basso */
.barra { position: fixed; left: 0; right: 0; bottom: 0; background: var(--carta); border-top: 1px solid var(--filo); display: flex; justify-content: space-around; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 10; }
.barra a { text-decoration: none; font-variant-caps: all-small-caps; letter-spacing: .08em; font-size: .82em; color: var(--tenue); min-height: 44px; min-width: 56px; display: flex; align-items: center; justify-content: center; }

const FORME = ['canzone', 'album', 'libro', 'poesia', 'film', 'serie', 'fumetto', 'spettacolo', 'immagine', 'gioco', 'video'];
const SPECIE = { stato: 'sentimenti', idea: 'idee', domanda: 'domande', corrente: 'correnti', simbolo: 'simboli', stile: 'stili' };
const CAMPI = ['filosofia', 'psicologia', 'mito-e-religione', 'esoterismo', 'scienza', 'storia', 'letteratura', 'arte', 'musica', 'cinema'];
const GESTI = ['penso', 'sento', 'chiedo', 'ricordo', 'voglio fare', 'trascrivo'];
const ESITI = ['verificata', 'simile', 'errata', 'non-trovata', 'da-verificare'];
const ASSI = [
  { k: 'cose', nome: 'cose' }, { k: 'persone', nome: 'persone' }, { k: 'temi', nome: 'temi' },
  { k: 'campo', nome: 'campo', prop: true }, { k: 'gesto', nome: 'gesto' }, { k: 'tempo', nome: 'tempo' },
];
const nomeCampo = (c) => c.replace(/-/g, ' ');
const SPECIE1 = { stato: 'sentimento', idea: 'idea', domanda: 'domanda', corrente: 'corrente', simbolo: 'simbolo', stile: 'stile' };
const RACC = { tatuaggi: 'per i tatuaggi' };
// L'etichetta di un valore, sempre la stessa in ogni vista.
function etichetta(asse, v) {
  const [t, x] = v.includes(':') ? [v.slice(0, v.indexOf(':')), v.slice(v.indexOf(':') + 1)] : ['', v];
  if (asse === 'cose') return t === 'f' ? x : t === 'c' ? 'citazioni' : t === 'e' ? (x === 'da-verificare' ? 'da verificare ⚠' : x.replace('-', ' ')) : NODI[x].nome;
  if (asse === 'temi') return t === 's' ? SPECIE[x] : NODI[x].nome;
  if (asse === 'campo') return nomeCampo(v);
  if (asse === 'gesto') return t === 'r' ? RACC[x] : v;
  if (asse === 'tempo') return v === 'origine' ? 'archivio d’origine' : `${MESI[+v.slice(5, 7) - 1]} ${v.slice(0, 4)}`;
  return NODI[v] ? NODI[v].nome : v;
}
const parlante = (id) => !F[id].delicato && !F[id].nonParlante;
const norm = (s) => s.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();

// I valori dei sei assi per una frase: un passo di legame, più l'autore e la catena dell'«in». Mai scritti: calcolati.
function valori(id, lente) {
  const f = F[id];
  const v = { cose: new Set(), persone: new Set(), temi: new Set(), campo: new Set(), gesto: new Set(), tempo: new Set(), nodi: new Set() };
  const campoDi = (s) => (NODI[s] && NODI[s].cerchia !== 'vita' ? NODI[s].campo || [] : []).forEach((c) => v.campo.add(c));
  const persona = (s) => { const n = NODI[s]; if (!n || n.cerchia === 'vita') return; v.persone.add(s); v.nodi.add(s); campoDi(s); if (n.in) opera(n.in, true); };
  function opera(s, perIn) { const n = NODI[s]; v.nodi.add(s); v.cose.add('o:' + s); if (n.forma) v.cose.add('f:' + n.forma); campoDi(s); if (n.autore && !perIn) persona(n.autore); }
  for (const s of f.nomina || []) {
    const n = NODI[s];
    if (n.genere === 'opere') opera(s);
    else if (n.genere === 'persone') persona(s);
    else if (n.genere === 'citazioni') {
      v.nodi.add(s); v.cose.add('c:citazione'); v.cose.add('e:' + (n.esito || 'da-verificare')); v.cose.add('o:' + s);
      if (n.autore) persona(n.autore);
      if (n.attribuita && n.attribuita !== n.autore) { const p = NODI[n.attribuita]; v.persone.add(n.attribuita); v.nodi.add(n.attribuita); if (p.in) opera(p.in, true); }
    }
  }
  const temi = [...(f.temi || []), ...(lente ? f.prop || [] : [])];
  for (const t of temi) { v.nodi.add(t); v.temi.add('t:' + t); v.temi.add('s:' + NODI[t].specie); if (NODI[t].specie === 'corrente') campoDi(t); }
  if (f.pos) v.gesto.add('penso');
  if ((f.stato || []).length) v.gesto.add('sento');
  if (f.chiedi) v.gesto.add('chiedo');
  if (f.vissuto) v.gesto.add('ricordo');
  if (Object.values(f.fru || {}).some((x) => x === 'da-fare' || x === 'in-corso')) v.gesto.add('voglio fare');
  if (f.altrui) v.gesto.add('trascrivo');
  if (f.serve) { v.gesto.add('r:' + f.serve); v.nodi.add(f.serve); }
  v.tempo.add(imp(id) ? 'origine' : f.reg.slice(0, 7));
  return v;
}
const VAL = { 0: {}, 1: {} };
const val = (id, lente) => (VAL[+lente][id] ||= valori(id, lente));

// Lo stato di Esplora: le scelte per asse (O dentro l'asse, E tra assi), il punto di partenza, la parola, la lente.
let ESP = { sel: {}, da: null, q: '', lente: false };
function leggiStato() {
  const p = new URLSearchParams((location.hash.split('?')[1]) || '');
  const sel = {};
  for (const a of ASSI) { const xs = p.getAll(a.k); if (xs.length) sel[a.k] = new Set(xs); }
  ESP = { sel, da: p.get('da'), q: p.get('q') || '', lente: p.get('lente') === 'proposte' };
}
function indirizzo(st = ESP) {
  const p = new URLSearchParams();
  if (st.da) p.append('da', st.da);
  for (const a of ASSI) for (const x of st.sel[a.k] || []) p.append(a.k, x);
  if (st.q) p.append('q', st.q);
  if (st.lente) p.append('lente', 'proposte');
  const s = p.toString();
  return '#/esplora' + (s ? '?' + s : '');
}
const conValore = (asse, v, st = ESP) => { const sel = { ...st.sel }; sel[asse] = new Set([...(sel[asse] || []), v]); return indirizzo({ ...st, sel }); };
const senzaValore = (asse, v, st = ESP) => { const sel = { ...st.sel }; const s = new Set(sel[asse]); s.delete(v); if (s.size) sel[asse] = s; else delete sel[asse]; return indirizzo({ ...st, sel }); };
const solo = (asse, v, da) => indirizzo({ sel: { [asse]: new Set([v]) }, da: da || null, q: '', lente: false });

function passa(id, st, tranne) {
  if (!parlante(id)) return false;
  const v = val(id, st.lente);
  if (st.da && !v.nodi.has(st.da) && !(F[id].vita || []).includes(st.da)) return false;
  if (st.q && !norm(F[id].testo).includes(norm(st.q))) return false;
  for (const a of ASSI) {
    if (a.k === tranne) continue;
    const s = st.sel[a.k]; if (!s || !s.size) continue;
    if (![...s].some((x) => v[a.k].has(x))) return false;
  }
  return true;
}
const filtrati = (st = ESP) => Object.keys(F).filter((id) => passa(id, st)).sort((a, b) => F[b].reg.localeCompare(F[a].reg));
// Il numero accanto a un valore: le frasi che resterebbero scegliendolo, sugli altri assi. Conta solo i parlanti (regola 3).
function conteggi(asse, st = ESP) {
  const m = new Map();
  for (const id of Object.keys(F)) {
    if (!passa(id, st, asse)) continue;
    for (const x of val(id, st.lente)[asse]) { const c = m.get(x) || { n: 0, imp: 0 }; imp(id) ? c.imp++ : c.n++; m.set(x, c); }
  }
  return m;
}
// L'ordine dei valori: forme e campi in ordine fisso, il tempo cronologico, il resto per numero.
function ordinati(asse, m) {
  const xs = [...m.keys()];
  const peso = (x) => -(m.get(x).n * 10 + m.get(x).imp);
  if (asse === 'cose') return [...FORME.map((f) => 'f:' + f), 'c:citazione', ...ESITI.map((e) => 'e:' + e)].filter((x) => m.has(x)).concat(xs.filter((x) => x.startsWith('o:')).sort((a, b) => peso(a) - peso(b)));
  if (asse === 'campo') return CAMPI.filter((x) => m.has(x));
  if (asse === 'gesto') return [...GESTI, ...Object.keys(RACC).map((r) => 'r:' + r)].filter((x) => m.has(x));
  if (asse === 'tempo') return xs.sort((a, b) => (a === 'origine' ? 1 : b === 'origine' ? -1 : b.localeCompare(a)));
  if (asse === 'temi') return Object.keys(SPECIE).map((s) => 's:' + s).filter((x) => m.has(x)).concat(xs.filter((x) => x.startsWith('t:')).sort((a, b) => peso(a) - peso(b)));
  return xs.sort((a, b) => peso(a) - peso(b));
}
const numero = (c) => (c.n ? `<span class="n">${c.n}</span>` : '<span class="n">·</span>');
const nomeNodo = (s) => (s && NODI[s] ? NODI[s].nome : '');

/* ===== Esplora ===== */
function chipAttive() {
  const xs = [];
  if (ESP.da) xs.push(`<a class="chip da" href="${indirizzo({ ...ESP, da: null })}" aria-label="togli ${esc(nomeNodo(ESP.da))}">da ${esc(nomeNodo(ESP.da))}<span aria-hidden="true">×</span></a>`);
  for (const a of ASSI) for (const x of ESP.sel[a.k] || []) xs.push(`<a class="chip attivo${a.prop ? ' c-prop' : ''}" href="${senzaValore(a.k, x)}" aria-label="togli ${esc(etichetta(a.k, x))}">${CS(esc(etichetta(a.k, x)))}${a.prop ? '&nbsp;◌' : ''}<span aria-hidden="true">×</span></a>`);
  return xs.join('');
}
const attivi = () => ESP.da || ESP.q || ASSI.some((a) => ESP.sel[a.k] && ESP.sel[a.k].size);
function totale(ids) {
  const n = ids.filter((id) => !imp(id)).length, i = ids.length - n;
  return `${n} ${n === 1 ? 'frase' : 'frasi'}${i ? ` · e ${i} dall’archivio d’origine, fuori dai conti` : ''}`;
}
// I nomi tra i risultati: i nodi delle frasi trovate che danno il valore scelto, e i nomi che la parola trova.
function nomiTrovati(ids) {
  const out = new Set();
  const reach = new Set(); ids.forEach((id) => val(id, ESP.lente).nodi.forEach((s) => reach.add(s)));
  const sel = ESP.sel;
  const vuole = (s) => {
    const n = NODI[s]; if (!n || n.cerchia === 'vita') return false;
    const ok = [];
    if (sel.cose) ok.push([...sel.cose].some((x) => x === 'o:' + s || (x === 'f:' + n.forma && n.genere === 'opere') || (x === 'c:citazione' && n.genere === 'citazioni') || (n.genere === 'citazioni' && x === 'e:' + (n.esito || 'da-verificare'))));
    if (sel.persone) ok.push(sel.persone.has(s));
    if (sel.temi) ok.push([...sel.temi].some((x) => x === 't:' + s || (n.genere === 'temi' && x === 's:' + n.specie)));
    if (sel.campo) ok.push([...sel.campo].some((c) => (n.campo || []).includes(c)));
    return ok.some(Boolean);
  };
  reach.forEach((s) => { if (s !== ESP.da && vuole(s)) out.add(s); });
  if (ESP.q) Object.keys(NODI).forEach((s) => { if (norm(NODI[s].nome).includes(norm(ESP.q))) out.add(s); });
  return [...out];
}
function rigaFrase(id) {
  const prop = ESP.lente && !passa(id, { ...ESP, lente: false });
  const nomi = [...val(id, ESP.lente).nodi].filter((s) => s !== ESP.da && NODI[s].genere !== 'raccolte').slice(0, 3).map(nomeNodo);
  const via = prop ? `<span class="luogo">entra per una mia lettura ◌: ${(F[id].prop || []).map(nomeNodo).join(', ')}</span>` : nomi.length ? `<span class="luogo">${esc(nomi.join(' · '))}</span>` : '';
  return `<li class="${prop ? 'smorzata' : ''}">${frase(id, { data: !imp(id) })}${via}</li>`;
}
function vuotoDetto() {
  const f = [...(ESP.sel.cose || [])].find((x) => x.startsWith('f:'));
  const m = { canzone: 'Nessuna canzone tua.', libro: 'Nessun libro tuo.', film: 'Nessun film tuo.', serie: 'Nessuna serie tua.', poesia: 'Nessuna poesia tua.' };
  return (f && m[f.slice(2)]) || (ESP.q ? 'Nessuna tua parola.' : 'Nessuna tua frase qui.');
}
function risultatiEsplora() {
  const ids = filtrati();
  const tuoi = ids.filter((id) => !imp(id)), orig = ids.filter(imp);
  const nomi = nomiTrovati(ids);
  const delic = ESP.q ? Object.keys(F).filter((id) => F[id].delicato && norm(F[id].testo).includes(norm(ESP.q))) : [];
  return `<p class="totale" aria-live="polite">${totale(ids)}${nomi.length ? ` · ${nomi.length} ${nomi.length === 1 ? 'nome' : 'nomi'}` : ''}</p>
    ${nomi.length ? `<h2>nomi</h2><p class="nomi">${nomi.map((s) => `<a href="#/nodo/${s}">${esc(NODI[s].nome)}</a>${NODI[s].genere === 'citazioni' && !NODI[s].esito ? vf : ''}`).join('<span class="sep"> · </span>')}</p>` : ''}
    ${ids.length ? `<h2>le tue frasi</h2><ul class="righe">${tuoi.map(rigaFrase).join('')}</ul>` : `<p class="vuoto">${vuotoDetto()}</p>`}
    ${orig.length ? `<p class="nota-r">${tetto(orig[0])}, ${orig.length > 1 ? 'trascritte' : 'trascritta'} da Claude nel seme:</p><ul class="righe">${orig.map(rigaFrase).join('')}</ul>` : ''}
    ${delic.length ? `<button class="delic" id="delic">e ${delic.length} risultato delicato · mostralo</button>` : ''}`;
}
// L'indice: senza filtri, Esplora mostra gli assi come parole da toccare, con i numeri. È la parte del navigare.
function indiceEsplora() {
  return ASSI.map((a) => {
    const m = conteggi(a.k); const xs = ordinati(a.k, m).filter((x) => !(a.k === 'cose' && (x.startsWith('o:') || x.startsWith('e:'))) && !(a.k === 'temi' && x.startsWith('t:')));
    const extra = a.k === 'temi' ? ordinati('temi', m).filter((x) => x.startsWith('t:')).slice(0, 6) : a.k === 'cose' ? ordinati('cose', m).filter((x) => x.startsWith('o:') && NODI[x.slice(2)].genere === 'opere').slice(0, 5) : [];
    const voci = (lista) => lista.slice(0, a.k === 'persone' ? 8 : 12).map((x) => `<a href="${conValore(a.k, x)}">${CS(esc(etichetta(a.k, x)))}${numero(m.get(x))}</a>`).join('');
    if (!xs.length) return '';
    return `<section class="asse${a.prop ? ' asse-prop' : ''}"><h2>${a.nome}${a.prop ? ' ◌ <span class="perche">scelto da me, sui nomi del mondo</span>' : ''}</h2>
      <p class="valori">${voci(xs)}</p>${extra.length ? `<p class="valori secondi">${voci(extra)}</p>` : ''}</section>`;
  }).join('');
}
V.esplora = () => {
  leggiStato();
  return `<div class="pagina esplora">${testa('esplora')}
    <div class="esp-testa">
      <input class="campo-cerca" id="q" type="search" value="${esc(ESP.q)}" placeholder="una parola, alla lettera" autocomplete="off" aria-label="Cerca nelle tue parole">
      <div class="chips" role="group" aria-label="Filtri attivi"><button class="chip filtra" id="filtra" aria-haspopup="dialog">filtra</button>${chipAttive()}</div>
    </div>
    <div id="esp-corpo">${attivi() ? risultatiEsplora() : `<p class="servizio">Tocca una parola per filtrare; le scelte si incrociano.</p>${indiceEsplora()}`}</div>
    <p class="lente"><button class="lente-b" id="lente" aria-pressed="${ESP.lente}">${ESP.lente ? 'solo le tue parole e le accolte' : 'anche le mie proposte ◌'}</button></p>
  </div>`;
};
// Il foglio dei filtri: un asse per sezione, i valori con il numero, live.
function foglioFiltri() {
  const ids = filtrati();
  const sez = ASSI.map((a) => {
    const m = conteggi(a.k); const xs = ordinati(a.k, m); if (!xs.length) return '';
    const on = ESP.sel[a.k] || new Set();
    const b = (x, i) => `<button class="val${on.has(x) ? ' on' : ''}${i >= 8 ? ' oltre' : ''}" data-asse="${a.k}" data-v="${esc(x)}" aria-pressed="${on.has(x)}">${CS(esc(etichetta(a.k, x)))}${numero(m.get(x))}</button>`;
    return `<section class="f-asse${a.prop ? ' asse-prop' : ''}"><h2>${a.nome}${a.prop ? ' ◌' : ''}</h2><div class="vals">${xs.map(b).join('')}${xs.length > 8 ? `<button class="altri" data-altri>altri ${xs.length - 8}</button>` : ''}</div></section>`;
  }).join('');
  return `<p class="sc">filtra · ${totale(ids)}</p>${sez}<div class="f-piede"><button class="mostra" id="mostra">mostra ${ids.length} ${ids.length === 1 ? 'frase' : 'frasi'}</button></div>`;
}
function aggiornaEsplora() {
  history.replaceState(null, '', indirizzo());
  document.getElementById('esp-corpo').innerHTML = attivi() ? risultatiEsplora() : `<p class="servizio">Tocca una parola per filtrare; le scelte si incrociano.</p>${indiceEsplora()}`;
  document.querySelector('.chips').innerHTML = `<button class="chip filtra" id="filtra" aria-haspopup="dialog">filtra</button>${chipAttive()}`;
  if (document.body.classList.contains('aperto') && document.querySelector('#foglio-c .f-asse, #foglio-c .mostra')) document.getElementById('foglio-c').innerHTML = foglioFiltri();
}

  const pezzo = (id) => {

    if (f.pin) return `<div class="pezzo p pin"><a class="data" href="#/frammento/${id}">${dataL(f.reg)} · pin</a><a href="${esc(f.testo)}" rel="noreferrer" target="_blank">${esc(f.pin)} ↗</a><span class="luogo">titolo dal link · nessuna anteprima</span></div>`;
    const dt = imp(id) ? '' : `<span class="data">${dataL(f.reg)}</span>`;
    const mondo = id === '20261030-2320-w2x8' ? `<span class="luogo">«…in mezzo all’inferno, non è inferno» ○ · Le città invisibili, parte nona, l’ultimo dialogo</span>` : '';
    return `<div class="pezzo ${f.misura}">${f.allegato ? disegno : ''}${dt}<a href="#/frammento/${id}" style="text-decoration:none"><span class="frase">${esc(f.testo)}${sg('sua')}</span></a>${mondo}</div>`;
  };
  const importati = `<div class="filo-t" style="margin:0">${tetto('20260912-0000-u02')}, trascritte da Claude nel seme</div>`;
  return `<div class="pagina ${stampa ? 'stampa-v' : ''}" style="max-width:1180px">${testa(stampa ? 'il brief' : 'la tavola')}
    <h1>tatuaggi</h1>
    <p class="servizio" style="margin:0">senza scopo</p>
    <div class="campo-t" style="margin-top:14px">
      <p class="legenda">${sg('sua')} tue · ${sg('mondo')} mondo</p>
      <div class="pezzi">
        ${pezzo('20261008-0745-e8a0')}
        <div class="filo-t">✦ linea</div>
        ${importati}
        ${pezzo('20260912-0000-u02')}${pezzo('20260912-0000-u03')}
        ${pezzo('20261030-2320-w2x8')}${pezzo('20261020-2214-k3q1')}
        <div class="filo-t">✦ faro</div>
        ${pezzo('20261027-1302-t9v4')}
      </div>
      ${stampa ? '' : `<div class="margine"><a href="#/nodo/tatuaggi" style="color:inherit">le idee arrivate con l’importazione →</a></div>`}
    </div>
    ${stampa ? `<p class="servizio no-stampa" style="margin-top:1em">Senza proposte ◌, senza delicati, senza persone della tua vita. <a href="#/tatuaggi">← la tavola</a> · <a href="javascript:print()">stampa</a></p>` : `<p class="servizio" style="margin-top:1em"><a href="#/tatuaggi/stampa">il brief da stampare →</a></p>`}
  </div>`;
};

V.vuoto = () => `<div class="pagina">${testa()}<p style="margin-top:3em" class="servizio">Niente qui.</p></div>`;

/* ===== Router ===== */
function vai() {
  const h = location.hash.replace(/^#\/?/, '');
  const [a0, b, c] = h.split('/'); const a = a0.split('?')[0];
  const stato = new URLSearchParams(location.search).get('soglia');
  let html;
  if (!a) html = V.soglia(stato);
  else if (a === 'ritorno') html = V.soglia('ritorno');
  else if (a === 'r') html = V.lettera();
  else if (a === 'nodo' && c === 'tavola') html = V.tavolaNodo();
  else if (a === 'nodo') html = V.nodo(b);
  else if (a === 'frammento') html = V.frammento(b);
  else if (a === 'tempo') html = V.tempo();
  else if (a === 'frasi') html = V.frasi();
  else if (a === 'esplora') html = V.esplora();
  else if (a.startsWith('cerca')) { location.replace('#/esplora?q=' + encodeURIComponent(new URLSearchParams(h.split('?')[1] || '').get('q') || '')); return; }
  else if (a === 'assenze') html = V.assenze();
  else if (a === 'tatuaggi') html = V.tatuaggi(b === 'stampa');
  else html = V.vuoto();
  document.getElementById('vista').innerHTML = html;
  document.querySelectorAll('.barra a').forEach((x) => x.classList.toggle('qui', x.dataset.r === (a || '')));
  chiudi(); window.scrollTo(0, 0);
  if (a === 'esplora') { const q = document.getElementById('q'); q.addEventListener('input', () => { ESP.q = q.value.trim(); aggiornaEsplora(); }); }
}
function apri(html, nome = 'Provenienza') { document.getElementById('foglio-c').innerHTML = html; document.getElementById('foglio').setAttribute('aria-label', nome); document.body.classList.add('aperto'); }
function chiudi() { document.body.classList.remove('aperto'); }
document.addEventListener('click', (e) => {
  const s = e.target.closest('[data-s]');
  if (s) { document.documentElement.dataset.strato = s.dataset.s; try { localStorage.setItem('mn-strato', s.dataset.s); } catch (x) {} return; }
  const v = e.target.closest('[data-voce]'); if (v) return apri(foglioVoce(v.dataset.voce));
  if (e.target.closest('#filtra')) return apri(foglioFiltri(), 'Filtri');
  const fv = e.target.closest('[data-asse]');
  if (fv) { const s = new Set(ESP.sel[fv.dataset.asse] || []); s.has(fv.dataset.v) ? s.delete(fv.dataset.v) : s.add(fv.dataset.v); if (s.size) ESP.sel[fv.dataset.asse] = s; else delete ESP.sel[fv.dataset.asse]; return aggiornaEsplora(); }
  const al = e.target.closest('[data-altri]'); if (al) { al.parentNode.classList.add('tutti'); al.remove(); return; }
  if (e.target.closest('#mostra')) return chiudi();
  if (e.target.closest('#lente')) { location.hash = indirizzo({ ...ESP, lente: !ESP.lente }); return; }
  if (e.target.id === 'velo') return chiudi();
  if (e.target.id === 'delic') { e.target.outerHTML = `<p style="margin:.6em 0">${frase('20261011-0210-f3b6')}</p>`; return; }
  const n = e.target.closest('.tela [data-n]'); if (n) zoom(n.dataset.n);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') chiudi(); if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tela [data-n]')) { e.preventDefault(); zoom(e.target.dataset.n); } });
function zoom(slug) {
  const p = window.__vicini.find((x) => x.s === slug); const svg = document.querySelector('.tela svg');
  const dx = (180 - (180 + p.x) / 2) * 1.6, dy = (180 - (180 + p.y) / 2) * 1.6;
  svg.style.transform = `translate(${dx / 3.6}%, ${dy / 3.6}%) scale(1.6)`;
  svg.classList.add('zoomato'); document.querySelectorAll('.tela .n').forEach((g) => g.classList.toggle('sel', g.dataset.n === slug));
  document.querySelectorAll('.tela line').forEach((l) => l.classList.toggle('acceso', l.dataset.l === slug));
  document.getElementById('livello').innerHTML = `frasi · attenzione — ${NODI[slug].nome} · <a href="#" id="indietro">tutti i nomi</a>`;
  document.getElementById('zoom').innerHTML = p.frasi.length
    ? `<h2>le frasi che li tengono insieme</h2><ul class="righe">${p.frasi.map((id) => `<li>${frase(id)}</li>`).join('')}</ul><p><a href="#/nodo/${slug}">${NODI[slug].nome} →</a></p>`
    : `<p class="servizio" style="margin-top:1em">Nessuna tua frase li tiene insieme: ${esc(p.via)}.</p><p><a href="#/nodo/${slug}">${NODI[slug].nome} →</a></p>`;
  document.getElementById('indietro').onclick = (e) => { e.preventDefault(); vai(); };
}
addEventListener('hashchange', vai);
vai();
</script>
