<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Il muro</title>
<script>
  // Anti-lampo: il tema segue il sistema; ?tema= serve solo alle foto del prototipo.
  (function () {
    var t = new URLSearchParams(location.search).get('tema');
    if (t === 'scuro') document.documentElement.dataset.theme = 'dark';
    if (t === 'chiaro') document.documentElement.dataset.theme = 'light';
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
<style>
:root {
  --carta: #f3eee3; --carta2: #e9e2d2; --foglio: #fbf8f1; --inchiostro: #1d1a16; --tenue: #6c655a; --filo: #d6ccb8;
  --velo: rgba(29,26,22,.06); --ombra: 0 1px 2px rgba(40,30,15,.10), 0 6px 18px rgba(40,30,15,.08);
  --ombra-su: 0 -10px 40px rgba(30,20,10,.18);
  --avviso: #e6d49a; --avviso-ink: #3a2f10;
  --u: 52px; --gap: 6px; --cols: 6;
  --spento: .13;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #13120f; --carta2: #1c1a16; --foglio: #22201b; --inchiostro: #ece5d8; --tenue: #9a9386; --filo: #34302a;
    --velo: rgba(236,229,216,.07); --ombra: 0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35); --ombra-su: 0 -10px 40px rgba(0,0,0,.6);
    --avviso: #c9b46a; --avviso-ink: #1f1a08; --spento: .11; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #13120f; --carta2: #1c1a16; --foglio: #22201b; --inchiostro: #ece5d8; --tenue: #9a9386; --filo: #34302a;
  --velo: rgba(236,229,216,.07); --ombra: 0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35); --ombra-su: 0 -10px 40px rgba(0,0,0,.6);
  --avviso: #c9b46a; --avviso-ink: #1f1a08; --spento: .11; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--carta); color: var(--inchiostro);
  font: 400 17px/1.45 "Source Serif 4", "Iowan Old Style", Georgia, serif; font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--inchiostro); outline-offset: 3px; }
.sg { font-family: "Noto Sans Symbols 2", "Segoe UI Symbol", sans-serif; font-style: normal; font-weight: 400; }
.sc { font-variant-caps: all-small-caps; letter-spacing: .07em; }
.tenue { color: var(--tenue); }
.vf { display: inline-block; font: 600 .72em/1 "Noto Sans Symbols 2", sans-serif; background: var(--avviso); color: var(--avviso-ink);
  padding: .22em .38em .18em; border-radius: 4px; vertical-align: .12em; margin-left: .25em; }

/* ===== La testa ===== */
.testa { padding: 14px 16px 4px; display: flex; align-items: baseline; gap: 10px; }
.marchio { font-variant-caps: all-small-caps; letter-spacing: .09em; font-size: .84em; color: var(--tenue); }
.titolo { font-size: 1.7em; font-weight: 450; letter-spacing: -.01em; margin: 0; line-height: 1.1; font-variation-settings: "opsz" 60; }
.titolo i { font-weight: 350; }
.legenda { padding: 0 16px; margin: 2px 0 6px; font-size: .78em; color: var(--tenue); }
.legenda .sg { color: var(--inchiostro); }

/* La barra dei comandi, appiccicata in alto */
.barra { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--carta) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--filo); }
.righe-barra { display: flex; align-items: center; gap: 8px; padding: 0 16px; }
.per { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; padding: 4px 0; mask-image: linear-gradient(90deg, #000 88%, transparent); }
.per::-webkit-scrollbar { display: none; }
.per-et { font-size: .8em; color: var(--tenue); white-space: nowrap; align-self: center; padding-right: 4px; }
.per button { min-height: 44px; padding: 0 12px; border-radius: 22px; white-space: nowrap; font-size: .92em; color: var(--tenue); }
.per button[aria-pressed="true"] { background: var(--inchiostro); color: var(--carta); }
.per button .sg { font-size: .8em; opacity: .8; }
.filtra { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--filo); white-space: nowrap; font-size: .92em; }
.filtra b { font-weight: 600; }
.attive { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
.attive:empty { display: none; }
.chip-on { min-height: 36px; padding: 0 6px 0 12px; border-radius: 18px; background: var(--inchiostro); color: var(--carta); font-size: .86em; display: inline-flex; align-items: center; gap: 4px; position: relative; }
.chip-on::after { content: ""; position: absolute; inset: -4px 0; } /* bersaglio ≥ 44 px */
.chip-on .x { width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: 12px; background: color-mix(in srgb, var(--carta) 18%, transparent); font-size: .9em; }
.chip-via { min-height: 36px; padding: 0 12px; font-size: .84em; color: var(--tenue); text-decoration: underline; text-underline-offset: .2em; text-decoration-color: var(--filo); }
.riassunto { padding: 8px 16px 10px; font-size: .84em; color: var(--tenue); min-height: 1.5em; }
.riassunto b { color: var(--inchiostro); font-weight: 600; }
.vuoto { padding: 4px 16px 16px; font-style: italic; }

/* ===== Il muro ===== */
#muro { padding: 4px 16px 140px; touch-action: pan-x pan-y; transform-origin: 50% 0; }
.gruppo { margin: 0 0 26px; }
.gruppo > h2 { margin: 18px 0 10px; font-weight: 400; font-size: 2.1em; line-height: 1; letter-spacing: -.015em; font-variation-settings: "opsz" 60;
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.gruppo > h2 small { font-size: .38em; letter-spacing: .02em; color: var(--tenue); font-variation-settings: "opsz" 12; }
.gruppo > h2 .sg { font-size: .5em; color: var(--tenue); }
.gruppo.resto > h2 { font-size: 1.2em; color: var(--tenue); }
.gruppo.intorno > h2 { font-size: 1em; color: var(--tenue); font-variant-caps: all-small-caps; letter-spacing: .08em; margin-top: 8px; }
.gruppo.intorno { padding-bottom: 18px; border-bottom: 1px solid var(--filo); margin-bottom: 20px; }
.griglia { display: grid; grid-template-columns: repeat(var(--cols), var(--u)); grid-auto-rows: var(--u); gap: var(--gap); grid-auto-flow: dense; }
.uno-solo { grid-template-columns: repeat(var(--cols), var(--u)); }

/* La striscia del tempo */
.fila { display: flex; gap: 18px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; margin: 0 -16px; padding: 0 16px 10px; align-items: flex-start; }
.fila .gruppo { flex: 0 0 auto; scroll-snap-align: start; border-left: 1px solid var(--filo); padding-left: 12px; margin: 0; }
.fila .gruppo > h2 { font-size: 1.9em; flex-direction: column; gap: 2px; margin-top: 4px; }
.fila .gruppo > h2 small { font-size: .42em; }

/* ===== La tessera ===== */
.t { position: relative; container-type: size; border-radius: 6px; overflow: hidden; text-align: left; background: var(--c1);
  color: var(--ink, #fff); box-shadow: var(--ombra); transition: opacity .45s, filter .45s, box-shadow .2s;
  -webkit-tap-highlight-color: transparent; }
.t:hover { box-shadow: 0 2px 4px rgba(40,30,15,.14), 0 12px 28px rgba(40,30,15,.16); }
.t.off { opacity: var(--spento); filter: grayscale(1); box-shadow: none; }
.t.sel { outline: 2.5px solid var(--inchiostro); outline-offset: 3px; }
.t.fuoco { outline: 2.5px solid var(--inchiostro); outline-offset: 4px; }
.t .arte { position: absolute; inset: 0; pointer-events: none; }
.t .arte svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.lab { display: none; position: absolute; left: 0; right: 0; bottom: 0; padding: 7px 8px 7px; line-height: 1.12; pointer-events: none; }
.lab .n { display: block; font-weight: 560; font-size: clamp(11px, 11.5cqmin, 26px); letter-spacing: -.005em;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; text-wrap: balance; }
.lab .m { display: block; font-size: clamp(9.5px, 6.6cqmin, 13px); opacity: .82; margin-top: 2px; font-variant-caps: all-small-caps; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lab .m .sg { font-variant-caps: normal; }
.fr { display: none; position: absolute; left: 0; right: 0; top: 0; padding: 10px 11px; font-style: italic; font-weight: 380;
  font-size: clamp(12px, 7cqmin, 18px); line-height: 1.28; pointer-events: none; overflow: hidden; display: none; }
.fr .d { display: block; font-style: normal; font-size: .72em; opacity: .75; margin-bottom: 3px; font-variant-caps: all-small-caps; letter-spacing: .06em; }
.dorso { display: none; position: absolute; inset: 6px 0; writing-mode: vertical-rl; transform: rotate(180deg); text-align: left;
  font-size: clamp(9px, 26cqw, 13px); font-weight: 560; padding: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.vfb { position: absolute; top: 5px; right: 5px; font: 600 11px/1 "Noto Sans Symbols 2", sans-serif; background: var(--avviso); color: var(--avviso-ink);
  padding: 4px 5px 3px; border-radius: 4px; pointer-events: none; }
.accb { position: absolute; top: 5px; left: 6px; font: 12px/1 "Noto Sans Symbols 2", sans-serif; pointer-events: none; opacity: .9; }
@container (min-width: 84px) and (min-height: 48px) { .lab { display: block; } }
@container (max-width: 83px) and (min-height: 96px) { .dorso { display: block; } }
@container (min-width: 190px) and (min-height: 170px) { .fr { display: block; } }
/* vicino: le frasi */
.z2 .t .fr { }

/* Le specie visive: ogni asse la sua forma */
.k-canzone { --ink: #f4efe6; }
.k-canzone .arte { background:
  radial-gradient(circle at 62% 46%, var(--c2) 0 7%, rgba(0,0,0,.55) 7.5% 8.5%, transparent 9%),
  repeating-radial-gradient(circle at 62% 46%, rgba(255,255,255,.0) 0 2px, rgba(255,255,255,.07) 2px 3px),
  radial-gradient(circle at 62% 46%, #15130f 0 44%, transparent 44.5%),
  linear-gradient(135deg, var(--c1), color-mix(in srgb, var(--c1) 70%, #000)); }
.k-album { --ink: #f4efe6; }
.k-album .arte { background:
  linear-gradient(180deg, transparent 0 62%, rgba(0,0,0,.35) 100%),
  repeating-linear-gradient(var(--ang), var(--c1) 0 18%, var(--c2) 18% 21%, var(--c1) 21% 34%),
  var(--c1); }
.k-libro { --ink: #f7f1e4; }
.k-libro .arte { background:
  linear-gradient(90deg, rgba(0,0,0,.28) 0 5px, rgba(255,255,255,.12) 5px 6px, transparent 6px),
  linear-gradient(180deg, transparent 0 14%, var(--c2) 14% 17%, transparent 17% 83%, var(--c2) 83% 85%, transparent 85%),
  var(--c1); }
.k-libro .lab { top: 18%; bottom: auto; padding-left: 13px; }
.k-libro .lab .n { font-weight: 600; }
.k-poesia { --c1: var(--foglio); --ink: var(--inchiostro); }
.k-poesia .arte { background: repeating-linear-gradient(180deg, transparent 0 13px, var(--filo) 13px 14px) 12px 18px / 60% 70% no-repeat, var(--foglio); }
.k-poesia .lab .n { font-style: italic; font-weight: 450; }
.k-film, .k-serie, .k-video { --ink: #f4efe6; }
.k-film .arte, .k-serie .arte { background:
  repeating-linear-gradient(90deg, transparent 0 6px, rgba(255,255,255,.55) 6px 10px, transparent 10px 16px) 0 3px / 100% 4px no-repeat,
  repeating-linear-gradient(90deg, transparent 0 6px, rgba(255,255,255,.55) 6px 10px, transparent 10px 16px) 0 calc(100% - 3px) / 100% 4px no-repeat,
  linear-gradient(#0d0c0a 0 10px, transparent 10px calc(100% - 10px), #0d0c0a calc(100% - 10px)),
  radial-gradient(ellipse at 70% 115%, var(--c2) 0 30%, transparent 62%),
  linear-gradient(180deg, color-mix(in srgb, var(--c1) 55%, #000), var(--c1)); }
.k-serie .arte::after { content: ""; position: absolute; right: 10px; top: 16px; width: 20px; height: 14px;
  background: linear-gradient(90deg, rgba(255,255,255,.7) 0 4px, transparent 4px 8px, rgba(255,255,255,.45) 8px 12px, transparent 12px 16px, rgba(255,255,255,.25) 16px); }
.k-film .lab, .k-serie .lab { bottom: 10px; }
.k-video .arte { background: radial-gradient(circle at 50% 42%, rgba(255,255,255,.85) 0 1px, transparent 1px), linear-gradient(160deg, var(--c1), color-mix(in srgb, var(--c1) 50%, #000)); }
.k-fumetto { --c1: var(--foglio); --ink: var(--inchiostro); }
.k-fumetto .arte { background:
  linear-gradient(var(--inchiostro), var(--inchiostro)) 50% 0 / 2px 55% no-repeat,
  linear-gradient(var(--inchiostro), var(--inchiostro)) 0 55% / 100% 2px no-repeat,
  linear-gradient(var(--inchiostro), var(--inchiostro)) 30% 100% / 2px 45% no-repeat,
  radial-gradient(circle at 75% 25%, var(--c2) 0 14%, transparent 15%), var(--foglio); border: 3px solid var(--inchiostro); border-radius: 6px; }
.k-fumetto .lab { background: var(--foglio); border-top: 2px solid var(--inchiostro); }
.k-spettacolo { --ink: #f4efe6; }
.k-spettacolo .arte { background:
  radial-gradient(ellipse 60% 70% at 50% 100%, color-mix(in srgb, var(--c2) 80%, #fff) 0 30%, transparent 70%),
  repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 3px, transparent 3px 9px), var(--c1);
  -webkit-mask: radial-gradient(120% 90% at 50% 100%, #000 99%, transparent 100%); mask: radial-gradient(120% 90% at 50% 100%, #000 99%, transparent 100%); }
.k-immagine { --ink: #fff; }
.k-immagine .arte { border: 5px solid #b89a5a; box-shadow: inset 0 0 0 2px #6e5a2c;
  background: linear-gradient(180deg, var(--c2) 0 48%, color-mix(in srgb, var(--c1) 70%, #fff) 48% 52%, var(--c1) 52%); border-radius: 6px; }
.k-gioco { --ink: #f4efe6; }
.k-gioco .arte { background: radial-gradient(circle, rgba(255,255,255,.22) 0 1.5px, transparent 2px) 0 0 / 9px 9px, linear-gradient(135deg, var(--c1), var(--c2)); }

.k-persona { border-radius: 50%; --ink: var(--inchiostro); }
.k-persona .arte { background: radial-gradient(circle at 50% 50%, transparent 0 62%, color-mix(in srgb, var(--c1) 70%, #000) 62.5% 63.5%, transparent 64%), radial-gradient(circle at 38% 30%, color-mix(in srgb, var(--c1) 60%, #fff), var(--c1)); }
.k-persona .mono, .k-finzione .mono { position: absolute; inset: 0; display: grid; place-items: center; font-size: 38cqmin; font-weight: 400; font-style: italic; letter-spacing: -.04em;
  font-variation-settings: "opsz" 60; pointer-events: none; opacity: .82; }
.k-persona .lab, .k-finzione .lab { text-align: center; bottom: 12%; padding: 0 12%; }
.k-persona .lab .n, .k-finzione .lab .n { font-size: clamp(10.5px, 10cqmin, 22px); }
@container (min-width: 84px) { .k-persona .mono, .k-finzione .mono { transform: translateY(-12%); } }
.k-finzione { border-radius: 50%; --ink: #efe3c2; --c1: #222a44; }
.k-finzione .arte { background: radial-gradient(circle, transparent 0 60%, #c9ab62 60.5% 61.5%, transparent 62% 66%, rgba(201,171,98,.5) 66.5% 67%, transparent 67.5%),
  radial-gradient(circle at 40% 30%, #34405f, #1a2036); }
.k-finzione .mono { color: #d9bf7c; }

.k-sentimento { border-radius: var(--blob); --ink: #1b1813; box-shadow: none; }
.k-sentimento .arte { background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c1) 55%, #fff) 0 18%, var(--c1) 60%, color-mix(in srgb, var(--c1) 82%, #000)); }
.k-sentimento .lab { text-align: center; bottom: 50%; transform: translateY(50%); }
.k-sentimento .lab .n { font-style: italic; font-weight: 450; font-size: clamp(12px, 15cqmin, 32px); }
.k-sentimento .fr, .k-persona .fr, .k-finzione .fr, .k-raccolta .fr { display: none !important; }
.k-idea { --c1: var(--foglio); --ink: var(--inchiostro); }
.k-idea .arte svg { stroke: var(--inchiostro); fill: none; opacity: .8; }
.k-domanda { --c1: #24211c; --ink: #f1ead9; }
:root[data-theme="dark"] .k-domanda { --c1: #ece4d2; --ink: #1d1a16; }
.k-domanda .arte::before { content: "?"; position: absolute; right: -4%; top: -28%; font-size: 120cqh; line-height: 1; font-style: italic; opacity: .1; font-weight: 300; }
.k-domanda .lab { top: 0; bottom: 0; display: none; align-content: center; }
@container (min-width: 84px) and (min-height: 48px) { .k-domanda .lab { display: grid; } }
.k-domanda .lab .n { font-style: italic; font-weight: 400; font-size: clamp(11px, 12cqmin, 24px); -webkit-line-clamp: 4; }
.k-domanda .fr { display: none !important; }
.k-corrente { --c1: #cfc5b1; --ink: #23201a; }
.k-corrente .arte { background: linear-gradient(180deg, #b8ad96 0 9%, transparent 9% 91%, #b8ad96 91%), repeating-linear-gradient(90deg, rgba(0,0,0,.09) 0 2px, transparent 2px 11px), var(--c1); }
.k-corrente .lab { text-align: center; }
.k-simbolo { --ink: var(--inchiostro); }
.k-simbolo .arte { background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--c1) 60%, #fff), var(--c1)); }
.k-simbolo .arte svg { stroke: #201c16; fill: none; stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; padding: 16%; padding-bottom: 26%; }
.k-stile { --ink: var(--inchiostro); --c1: var(--foglio); }
.k-stile .lab { background: var(--foglio); }
.k-citazione { --c1: var(--foglio); --ink: var(--inchiostro); border-radius: 2px; }
.k-citazione .arte { background: linear-gradient(90deg, transparent 0 12px, transparent 12px), repeating-linear-gradient(180deg, transparent 0 17px, color-mix(in srgb, var(--filo) 45%, transparent) 17px 18px); }
.k-citazione .lab { top: 0; bottom: 0; display: none; align-content: center; padding: 10px 28px 8px 12px; border-left: 3px solid var(--filo); }
@container (min-width: 84px) and (min-height: 48px) { .k-citazione .lab { display: grid; } }
.k-citazione .lab .n { font-style: italic; font-weight: 400; font-size: clamp(11px, 11cqmin, 22px); -webkit-line-clamp: 4; }
.k-citazione .fr { display: none !important; }
.k-raccolta { --c1: #2a2620; --ink: #f1ead9; }
.k-raccolta .arte { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 3px; padding: 8px 8px 46px; }
.k-raccolta .arte i { border-radius: 2px; }
.k-raccolta .lab .n { font-size: clamp(13px, 12cqmin, 26px); font-weight: 450; }

/* Lo strato ◌: spento di default; acceso, resta più quieto */
.t.prop { background: transparent !important; box-shadow: none; outline: 1.5px dashed var(--filo); outline-offset: -1.5px; --ink: var(--tenue) !important; color: var(--tenue); }
.t.prop .arte { opacity: .16; filter: grayscale(1); }
.t.prop .lab .m { opacity: .7; }
.t.prop .lab .n { font-weight: 400; font-style: italic; }
.t.prop .mono { opacity: .3; }
.t.prop.off { opacity: .07; }

/* ===== I fogli: filtri e scheda ===== */
.velo { position: fixed; inset: 0; background: rgba(0,0,0,.0); z-index: 30; pointer-events: none; transition: background .3s; }
.foglio { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--foglio); color: var(--inchiostro);
  border-radius: 16px 16px 0 0; box-shadow: var(--ombra-su); transform: translateY(105%); transition: transform .38s cubic-bezier(.2,.8,.2,1);
  max-height: 64vh; display: flex; flex-direction: column; }
.foglio.aperto { transform: none; }
.foglio .maniglia { flex: 0 0 auto; height: 28px; display: grid; place-items: center; cursor: grab; touch-action: none; }
.foglio .maniglia::before { content: ""; width: 44px; height: 5px; border-radius: 3px; background: var(--filo); }
.foglio .dentro { overflow-y: auto; padding: 0 18px calc(24px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }
.foglio .chiudi { position: absolute; right: 8px; top: 4px; width: 44px; height: 44px; font-size: 1.3em; color: var(--tenue); }
#filtri.foglio { max-height: 56vh; }

.asse { margin: 4px 0 16px; }
.asse h3 { margin: 0 0 6px; font-weight: 500; font-size: .86em; font-variant-caps: all-small-caps; letter-spacing: .09em; color: var(--tenue); display: flex; gap: 8px; align-items: baseline; }
.asse h3 .q { font-variant-caps: normal; letter-spacing: 0; font-style: italic; font-weight: 380; }
.valori { display: flex; flex-wrap: wrap; gap: 6px; }
.v { min-height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid var(--filo); font-size: .9em; display: inline-flex; align-items: center; gap: 6px; }
.v .c { font-size: .78em; color: var(--tenue); font-variant-numeric: tabular-nums; }

  const at = []; if (S.muro) at.push(`<button class="chip-on" data-via-muro>${esc(N[S.muro].scopo)} <span class="x" aria-hidden="true">×</span><span class="sr">togli</span></button>`);

function etichetta(asse, x) {

  if (asse === 'campo') return nomeCampo(x) + ' ◌';
  if (asse === 'gesto') return t === 'r' ? N[v].scopo : x;
  if (asse === 'tempo') return nomeMese(x);

}
const aperti = new Set();
function filtri() {
  const c = document.getElementById('filtri-c');

  const conto = (asse, x) => CONTI[asse][x] || 0;
  const blocchi = ASSI.map((a) => {
    let vals = [];
    if (a.k === 'cose') vals = [...TIPI.map((x) => 'f:' + x), 'c:citazione', ...ESITI.map((x) => 'e:' + x)];
    if (a.k === 'persone') vals = Object.keys(N).filter((x) => N[x].g === 'persone');
    if (a.k === 'temi') vals = [...Object.keys(SPECIE).map((x) => 's:' + x), ...Object.keys(N).filter((x) => N[x].g === 'temi' && (!N[x].dedotto || S.lente || DI[x].some((y) => y.v === 'acc'))).map((x) => 't:' + x)];
    if (a.k === 'campo') vals = CAMPI;
    if (a.k === 'gesto') vals = GESTI;
    if (a.k === 'tempo') vals = MESIK.filter((x, i) => i <= S.fino).slice().reverse();
    let righe = vals.map((x) => ({ x, n: conto(a.k, x), on: sel(a.k).has(x) })).filter((r) => r.n > 0 || r.on || (a.k === 'tempo' && r.x === 'origine'));
    if (a.k === 'persone' || (a.k === 'temi')) {
      const sp = righe.filter((r) => r.x.startsWith('s:')); const resto = righe.filter((r) => !r.x.startsWith('s:')).sort((p, q) => q.n - p.n);
      righe = [...sp, ...resto];

    const lungo = (a.k === 'persone' || a.k === 'temi') && righe.length > 14 && !aperti.has(a.k);
    const mostra = lungo ? righe.filter((r, i) => i < 14 || r.on) : righe;
    const pallino = (x) => { const id = x.startsWith('t:') ? x.slice(2) : a.k === 'persone' ? x : null; return id && N[id] ? `<span class="pt" style="--c1:${colori(id)[0]}"></span>` : ''; };
    return `<div class="asse"><h3>${a.nome}${a.prop ? ' <span class="sg">◌</span>' : ''} <span class="q">${a.q}</span></h3><div class="valori">${mostra.map((r) =>
      `<button class="v${(a.k === 'campo' || r.x.startsWith('s:')) ? ' prop' : ''}" aria-pressed="${r.on}" data-v="${a.k}|${esc(r.x)}">${pallino(r.x)}${esc(etichetta(a.k, r.x))}${r.x === 'origine' ? '' : ` <span class="c">${r.n}</span>`}</button>`).join('')}${lungo ? `<button class="v altre" data-altre="${a.k}">tutte (${righe.length})</button>` : ''}</div></div>`;

  const inp = c.querySelector('#parola'); let tm; inp.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { S.q = inp.value.trim(); disegna(); const i2 = document.getElementById('parola'); i2.focus(); i2.setSelectionRange(i2.value.length, i2.value.length); }, 260); });
}

// La scheda: arrivando a un nodo, una tua frase ✦ datata, alla lettera, in corsivo
function scheda(id) {
  const n = N[id], s = st[id] || { c: 0 };
  const mie = DI[id].filter(({ f, v }) => conta(v) && entro(f) && (parlante(f) || imp(f))).sort((a, b) => (imp(a.f) - imp(b.f)) || (a.f.reg < b.f.reg ? 1 : -1));
  const proposte = DI[id].filter(({ f, v }) => v === 'prop' && entro(f) && parlante(f));
  const tipo = n.g === 'opere' ? [n.tipo, n.autore ? N[n.autore].nome : null, n.anno].filter(Boolean).join(' · ')

  const riga = ({ f, v }, grande) => {
    const d = imp(f) ? tetto(f) + ', trascritta da Claude nel seme' : MESE_BREVE(f.reg);
    if (f.altrui) return `<span class="d">${d}</span><span>hai trascritto ${esc(f.altrui.cosa)}</span> <span class="sg">✦</span> <span class="s">${esc(f.altrui.commento)}</span> <span class="sg">✦</span><span class="mondo" style="display:block">«${esc(f.altrui.riga)}» <span class="sg">○</span><span class="luogo">${esc(f.altrui.luogo)}</span></span>`;
    const vf = f.links.some((l) => N[l.n].k === 'citazione' && !N[l.n].esito) ? '<span class="vf" aria-label="da verificare">⚠</span>' : '';
    const segno = v === 'acc' ? ' <span class="sg" aria-label="legame accolto">●</span>' : '';
    return `<span class="d">${d}${segno}</span><span class="s">${esc(f.testo)}</span> <span class="sg" aria-label="tua">✦</span>${vf}`;
  };
  let h = '';
  if (S.filo.length > 1) h += `<nav class="filo" aria-label="Il filo">filo: ${S.filo.slice(-6).map((x, i, a) => i === a.length - 1 ? `<span>${esc(N[x].nome)}</span>` : `<button data-vai="${x}">${esc(N[x].nome)}</button> →`).join(' ')}</nav>`;
  h += `<p class="tipo">${tipo}</p><h2>${esc(n.nome)}${n.k === 'citazione' && !n.esito ? '<span class="vf" aria-label="da verificare">⚠</span>' : ''}</h2>`;
  if (mie.length) {
    h += `<div class="porta">${riga(mie[0], true)}</div>`;
    const resto = mie.slice(1);
    if (resto.length) {
      h += `<p class="sezione">le tue frasi qui · ${mie.filter((x) => !imp(x.f)).length}${mie.some((x) => imp(x.f)) ? ' · e dall’archivio d’origine' : ''}</p><ul class="frasi">${resto.slice(0, 4).map((x) => `<li>${riga(x)}</li>`).join('')}</ul>`;
      if (resto.length > 4) h += `<button class="altre-fr" data-tutte="${id}">le altre ${resto.length - 4}</button><ul class="frasi" hidden id="altre-fr">${resto.slice(4).map((x) => `<li>${riga(x)}</li>`).join('')}</ul>`;
    }
  } else if (proposte.length) {
    h += `<p class="prop-r">Non l’hai mai detto: è una mia lettura <span class="sg">◌</span>, in ${proposte.length} ${proposte.length === 1 ? 'frase' : 'frasi'} tue.</p><ul class="frasi">${proposte.slice(0, 3).map((x) => `<li>${riga(x)}</li>`).join('')}</ul>`;
  } else h += '<p class="tenue">Niente, fino a qui.</p>';
  // il mondo ○, solo con opera e passo
  if (n.k === 'citazione') {
    if (n.mondo && n.rif) h += `<p class="sezione">il mondo</p><p class="mondo">«${esc(n.mondo)}» <span class="sg">○</span>${n.resa ? ' <span class="tenue">(resa mia)</span>' : ''}<span class="luogo">${esc(n.rif)} · ${n.esito}${n.attribuita && n.autore !== n.attribuita ? ' · la dice ' + esc(N[n.attribuita].nome) : ''}</span></p>`;
    else h += `<p class="sezione">il mondo</p><p><span class="vf">⚠</span> Da verificare: ${n.attribuita ? `l’attribuzione a ${esc(N[n.attribuita].nome)} non è ancora controllata.` : 'non sai di chi sia, e non l’ho ancora trovata.'}</p>`;
  }
  if (S.lente && proposte.length && mie.length) h += `<p class="sezione">le mie proposte <span class="sg">◌</span></p><p class="prop-r">L’ho letto anche in ${proposte.length} ${proposte.length === 1 ? 'altra frase' : 'altre frasi'} dove non lo nomini.</p>`;
  const leg = legati(id, 10);
  if (leg.length) h += `<p class="sezione">sul muro, intorno</p><div class="legate">${leg.map((x) => `<button class="v" data-vai="${x}"><span class="pt" style="--c1:${colori(x)[0]}"></span>${esc(N[x].nome)}</button>`).join('')}</div>`;

document.addEventListener('click', (e) => {
