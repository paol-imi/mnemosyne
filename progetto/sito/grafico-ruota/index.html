<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>La ruota</title>
<script>
  // Anti-lampo: il tema segue il sistema; ?tema= serve solo alle foto del prototipo.
  (function () {
    var t = new URLSearchParams(location.search).get('tema');
    if (t === 'scuro') document.documentElement.dataset.theme = 'dark';
    if (t === 'chiaro') document.documentElement.dataset.theme = 'light';
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
<style>
:root {
  --carta: #f3eee3; --carta-2: #ebe4d6; --carta-3: #ded5c3; --ink: #221f1b; --ink-2: #4e473e; --tenue: #81796c; --filo: #cfc5b2;
  --luce: #f2c463; --halo: rgba(242,196,99,.55); --oro: #9a6c17;
  --c-gesto: #575b93; --c-sent: #985a79; --c-temi: #a07018; --c-campo: #8d9188; --c-pers: #2a7868; --c-cose: #2e5b8a; --c-tempo: #8a6a48;
  --warn: #c8962a; --tavola: #1d1b19; --tavola-2: #26231f; --biglietto: #f6f0e3; --biglietto-2: #e9e2d2;
  --ombra: 0 -10px 30px rgba(40,30,20,.14);
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --segni: "Noto Sans Symbols 2", "Segoe UI Symbol", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #121318; --carta-2: #1a1c22; --carta-3: #262832; --ink: #ece6da; --ink-2: #c6bfb2; --tenue: #8f897e; --filo: #34363f;
    --luce: #f6cf73; --halo: rgba(246,207,115,.42); --oro: #e3b45a;
    --c-gesto: #9ea2e6; --c-sent: #d99ab8; --c-temi: #e2b257; --c-campo: #8f958c; --c-pers: #62c4ad; --c-cose: #7fabe0; --c-tempo: #c7a27c;
    --warn: #e2b04a; --ombra: 0 -10px 30px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #121318; --carta-2: #1a1c22; --carta-3: #262832; --ink: #ece6da; --ink-2: #c6bfb2; --tenue: #8f897e; --filo: #34363f;
  --luce: #f6cf73; --halo: rgba(246,207,115,.42); --oro: #e3b45a;
  --c-gesto: #9ea2e6; --c-sent: #d99ab8; --c-temi: #e2b257; --c-campo: #8f958c; --c-pers: #62c4ad; --c-cose: #7fabe0; --c-tempo: #c7a27c;
  --warn: #e2b04a; --ombra: 0 -10px 30px rgba(0,0,0,.5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--carta); color: var(--ink); font: 400 17px/1.45 var(--serif); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sg { font-family: var(--segni); font-style: normal; font-size: .72em; vertical-align: .1em; margin-left: .18em; }
.sg.w { color: var(--warn); }
.sg.p { color: var(--tenue); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* testata */
.testa { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--filo); }
.marchio { font-variant-caps: all-small-caps; letter-spacing: .08em; color: var(--tenue); font-size: 15px; }
.titolo { font-size: 19px; font-weight: 500; letter-spacing: -.005em; }
.titolo i { font-weight: 400; color: var(--oro); }
.testa .sp { flex: 1; }

/* scena */
.scena { position: relative; }
.barra { padding: 6px 16px 0; min-height: 34px; }
.barra .attivi { margin-top: 4px; }
.ruota-box { position: relative; width: 100%; height: min(calc(118vw + 52px), 66vh); touch-action: none; user-select: none; -webkit-user-select: none; }
#ruota { width: 100%; height: calc(100% - 52px); display: block; cursor: grab; outline: none; }
#ruota:focus-visible { outline: 2px dashed var(--tenue); outline-offset: -4px; }
#ruota.trascina { cursor: grabbing; }
.zoom { position: absolute; right: 12px; bottom: 4px; display: flex; flex-direction: row; gap: 6px; align-items: center; }
.zoom #zre { width: auto; border-radius: 22px; padding: 0 14px; font-size: 14.5px; }
@media (min-width: 960px) { .zoom { flex-direction: column; right: 10px; bottom: 10px; gap: 6px; } }
.zoom button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--filo); background: color-mix(in srgb, var(--carta) 88%, transparent); font-size: 20px; line-height: 1; cursor: pointer; }
.zoom button:disabled { opacity: .35; }
.aiuto { display: none; position: absolute; left: 12px; bottom: 8px; font-size: 12.5px; color: var(--tenue); max-width: 46%; line-height: 1.3; pointer-events: none; }

.pannello { padding: 4px 16px 150px; }
.servizio { font-size: 14.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; min-height: 26px; }
.servizio .vuoto { color: var(--ink); }
.attivi { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; }
.attivi:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 12px; border-radius: 18px; border: 1px solid var(--filo); background: var(--carta-2); font-size: 14.5px; cursor: pointer; white-space: nowrap; }
.chip .x { color: var(--tenue); font-size: 15px; }
.chip .n { color: var(--tenue); font-size: 12.5px; font-variant-numeric: lining-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--carta); border-color: var(--ink); }
.chip[aria-pressed="true"] .n { color: var(--carta-3); }
.chip .pt { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
.chip svg { flex: none; }
.togli { background: none; border: 0; color: var(--tenue); text-decoration: underline; text-underline-offset: .2em; font-size: 14px; min-height: 36px; cursor: pointer; padding: 0 4px; }

.anelli { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.anelli::-webkit-scrollbar { display: none; }
.anello { flex: none; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--filo); background: transparent; display: inline-flex; align-items: center; gap: 8px; font-size: 15.5px; cursor: pointer; }
.anello .pt { width: 10px; height: 10px; border-radius: 50%; }
.anello.quieto { color: var(--tenue); }
.anello[aria-expanded="true"] { background: var(--carta-2); border-color: var(--ink-2); }
.anello.ha { font-weight: 600; }
.anello.ha::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.vassoio { padding: 10px 0 4px; }
.vassoio h3 { margin: 0 0 6px; font-weight: 400; font-size: 13.5px; color: var(--tenue); }
.vassoio .chips { display: flex; flex-wrap: wrap; gap: 6px; }

.tempo { margin-top: 12px; }
.tempo .riga { display: flex; align-items: center; gap: 10px; }
.tempo .play { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--filo); background: var(--carta-2); cursor: pointer; font-size: 15px; flex: none; }
.tempo svg { display: block; width: 100%; height: 64px; overflow: visible; }
.tempo .bar { cursor: pointer; }
.tempo .cap { font-size: 13.5px; color: var(--ink-2); margin: 2px 0 0 54px; min-height: 20px; }
.tempo input[type=range] { width: 100%; margin: 0; accent-color: var(--c-tempo); height: 28px; }
.lente { display: flex; align-items: center; gap: 10px; margin-top: 10px; min-height: 44px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--tenue); font-size: 15px; }
.lente .sw { width: 38px; height: 22px; border-radius: 11px; background: var(--carta-3); position: relative; transition: background .2s; flex: none; }
.lente .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--carta); transition: left .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.lente[aria-pressed="true"] .sw { background: var(--tenue); }
.lente[aria-pressed="true"] .sw::after { left: 19px; }
.legenda { font-size: 13px; color: var(--tenue); margin-top: 6px; }

/* il foglio: dal basso sul telefono, di lato sul desktop */
.foglio { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--carta); box-shadow: var(--ombra); border-radius: 16px 16px 0 0; border-top: 1px solid var(--filo);
  max-height: 78vh; display: flex; flex-direction: column; transform: translateY(calc(100% - var(--sbircia, 128px))); transition: transform .28s ease; }
.foglio.aperto { transform: translateY(0); }
.maniglia { flex: none; height: 26px; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 0; background: none; width: 100%; }
.maniglia::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: var(--filo); }
.foglio-c { overflow-y: auto; padding: 0 18px 22px; }
.etic { font-size: 12.5px; letter-spacing: .07em; font-variant-caps: all-small-caps; color: var(--tenue); display: flex; align-items: center; gap: 8px; }
.etic .pt { width: 8px; height: 8px; border-radius: 50%; }
.data { display: block; font-size: 13.5px; color: var(--tenue); font-variant-numeric: lining-nums; }
.frase { font-size: 21px; line-height: 1.3; margin: 2px 0 8px; }
.frase i { font-style: italic; }
.frase.piccola { font-size: 17px; margin-bottom: 6px; }
.mondo { font-size: 16px; margin: 0 0 6px; }
.luogo { display: block; font-size: 13px; color: var(--tenue); }
.foglio:not(.aperto) .frase { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.foglio h2 { margin: 2px 0 4px; font-size: 25px; font-weight: 500; line-height: 1.15; }
.allineati { list-style: none; padding: 0; margin: 10px 0 8px; display: grid; grid-template-columns: auto 1fr; gap: 0 12px; font-size: 15px; }
.allineati li { display: contents; }
.allineati .a { color: var(--tenue); font-size: 13px; padding: 6px 0; border-top: 1px solid var(--filo); display: flex; gap: 6px; align-items: center; }
.allineati .v { padding: 6px 0; border-top: 1px solid var(--filo); }
.allineati .fuori { color: var(--tenue); }
.allineati .dentro { font-weight: 600; }
.azioni { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.bott { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--ink-2); background: var(--ink); color: var(--carta); font-size: 15.5px; cursor: pointer; }
.bott.leggero { background: transparent; color: var(--ink); border-color: var(--filo); }
.conto { font-size: 14px; color: var(--ink-2); }

/* desktop */
@media (min-width: 960px) {
  .scena { display: grid; grid-template-columns: 1fr 440px; grid-template-rows: auto 1fr; height: calc(100vh - 52px); }
  .barra { grid-column: 1; grid-row: 1; padding: 10px 20px 0; }
  .ruota-box { height: 100%; grid-column: 1; grid-row: 2; min-height: 0; }
  #ruota { height: 100%; }
  .pannello { grid-column: 2; grid-row: 1 / span 2; }
    .pannello > * { flex: none; }
  .anelli { flex-wrap: wrap; overflow: visible; margin: 0; padding: 10px 0 4px; }
  .pannello { overflow-y: auto; border-left: 1px solid var(--filo); padding: 16px 22px 24px; display: flex; flex-direction: column; }
  .foglio { position: static; transform: none; box-shadow: none; border-radius: 0; border: 0; border-top: 1px solid var(--filo); margin: 14px -22px 0; max-height: none; order: -1; border-top: 0; border-bottom: 1px solid var(--filo); margin-top: -16px; padding-top: 10px; }
  .maniglia { display: none; }
  .foglio-c { overflow: visible; padding: 0 22px 16px; }
  .aiuto { display: block; max-width: 300px; font-size: 13.5px; }
}

/* la tavola */
.tavola { position: fixed; inset: 0; z-index: 50; background: var(--tavola); color: #efe7d8; display: flex; flex-direction: column;
  background-image: radial-gradient(rgba(255,255,255,.025) 1px, transparent 1px); background-size: 5px 5px; }
.tavola[hidden] { display: none; }
.tavola:not([hidden]) { animation: entra .32s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
.tavola .tt { display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; height: 56px; border-bottom: 1px solid rgba(255,255,255,.08); flex: none; }
.tavola .tt .marchio { color: #a49a88; }
.tavola .filo-a { flex: 1; overflow-x: auto; white-space: nowrap; font-size: 14px; color: #a49a88; scrollbar-width: none; }
.tavola .filo-a button { background: none; border: 0; color: #cfc4b0; min-height: 44px; padding: 0 2px; cursor: pointer; font-size: 14px; }
.tavola .filo-a button[aria-current="true"] { color: #fff; }
.tavola .chiudi { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: none; color: #efe7d8; font-size: 20px; cursor: pointer; flex: none; }
.tavola .corpo { flex: 1; overflow: auto; position: relative; -webkit-overflow-scrolling: touch; }
.tavola .asse { position: relative; margin: 0 auto; }
.tavola svg.fili { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.tavola .piede { flex: none; display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.25); overflow-x: auto; }
.tavola .piede .bott { background: #efe7d8; color: #1d1b19; border-color: #efe7d8; white-space: nowrap; }
.tavola .piede .bott.leggero { background: transparent; color: #efe7d8; border-color: rgba(255,255,255,.25); }
.c { position: absolute; left: 0; top: 0; color: #24201b; transform-origin: 50% 50%; transition: opacity .2s; }
.c.spento { opacity: .25; }
button.c { font: inherit; text-align: left; cursor: pointer; border: 0; }
.c-titolo { color: #efe7d8; text-align: center; width: 300px; }
.c-titolo .k { font-size: 12.5px; letter-spacing: .08em; font-variant-caps: all-small-caps; color: #a49a88; }
.c-titolo h2 { font-size: 34px; font-weight: 500; margin: 2px 0 2px; line-height: 1.05; }
.c-titolo .n { font-size: 14px; color: #c9bfae; }
.c-frase { background: var(--biglietto); padding: 12px 16px 12px; box-shadow: 0 8px 22px rgba(0,0,0,.45); border-radius: 2px; }
.c-frase .data { color: #7b7264; font-size: 12.5px; }
.c-frase p { margin: 2px 0 0; font-size: 18px; line-height: 1.3; }
.c-frase.porta p { font-size: 25px; line-height: 1.22; }
.c-frase.porta { padding: 16px 20px 18px; }
.c-frase .mondo { font-size: 14px; margin-top: 8px; color: #3c362e; }
.c-opera { background: #2b2824; color: #efe7d8; padding: 10px 12px 10px; border: 1px solid rgba(255,255,255,.14); border-radius: 3px; width: 160px; box-shadow: 0 6px 16px rgba(0,0,0,.4); }
.c-opera .gl { display: block; margin-bottom: 6px; }
.c-opera i { font-size: 16.5px; line-height: 1.2; display: block; }
.c-opera small { display: block; color: #a49a88; font-size: 12.5px; margin-top: 3px; }
.c-persona { width: 104px; height: 104px; border-radius: 50%; background: #e3dccd; display: flex !important; align-items: center; justify-content: center; text-align: center !important; font-size: 15px; line-height: 1.15; padding: 10px; box-shadow: 0 6px 16px rgba(0,0,0,.4); }
.c-tema { background: none; color: var(--c-temi-t, #e7bf6a); font-size: 21px; padding: 8px 4px; display: flex !important; align-items: center; gap: 8px; }
.c-tema .pt { width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: 0 0 12px currentColor; }
.c-cit { background: #d9d3c6; padding: 12px 14px; width: 250px; box-shadow: 0 6px 16px rgba(0,0,0,.4); border-radius: 2px; }
.c-cit p { margin: 0; font-size: 16px; line-height: 1.3; }
.c-cit .luogo { color: #5f574b; margin-top: 6px; }
.c-cit.dub { background: #3a352d; color: #efe7d8; border: 1px dashed #e2b04a; }
.c-cit.dub .luogo { color: #c9bfae; }
.c-prop { opacity: .55; border: 1px dashed rgba(255,255,255,.4); background: transparent !important; color: #cfc4b0 !important; box-shadow: none !important; }
.c-mese { color: #c9bfae; font-size: 15px; padding: 6px; }
.tavola .vuoto-t { color: #c9bfae; padding: 24px; text-align: center; }

@media (min-width: 960px) {
  .tavola { inset: 3vh 3vw; border-radius: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .velo-t { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 49; }
}
.velo-t[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
/* svg */
.alidada { fill: var(--carta); opacity: .72; }
.lbl { font-family: var(--serif); fill: var(--ink); paint-order: stroke; stroke: var(--carta); stroke-width: 3.2px; stroke-linejoin: round; }
.lbl.anel { fill: var(--ink-2); font-size: 11.5px; letter-spacing: .04em; }
.lbl.mezzo { font-size: 12.5px; font-weight: 600; }
.lbl.mezzo.it { font-style: italic; }
.lbl.mezzo.fuori { font-weight: 400; fill: var(--ink-2); }
.lbl.nodo { font-size: 11.5px; fill: var(--ink-2); }
.lbl.nodo.it { font-style: italic; }
.lbl.mese { font-size: 10.5px; fill: var(--tenue); }
.lbl.arco { font-size: 10px; fill: var(--ink-2); }
.hub-t { font-family: var(--serif); fill: var(--ink); text-anchor: middle; }
</style>
</head>
<body>
<header class="testa">
  <span class="marchio">Mnemosyne</span><span class="titolo">la <i>ruota</i></span><span class="sp"></span>
</header>
<div class="scena">
  <div class="barra" id="barra"><div class="servizio" id="servizio" aria-live="polite"></div><div class="attivi" id="attivi"></div></div>
  <section class="ruota-box" id="box">
    <svg id="ruota" role="application" aria-label="La ruota: sette anelli, dal centro gesto, sentimenti, temi, campo, persone, cose, tempo. Trascina un anello per girarlo; tocca un nodo per aprire la sua tavola. Frecce: gira l'anello scelto; su e giù: cambia anello; Invio: apri ciò che sta a mezzogiorno." tabindex="0"></svg>
    <p class="aiuto" id="aiuto">Trascina un anello per girarlo. Ciò che sta sulla linea di mezzogiorno si allinea.</p>
    <div class="zoom"><button id="zin" aria-label="Avvicina">+</button><button id="zout" aria-label="Allontana">−</button><button id="zre" aria-label="Tutta la ruota">◎ tutta</button></div>
  </section>
  <aside class="pannello" id="pannello">
    <div class="anelli" id="anelli" role="toolbar" aria-label="Gli anelli: tocca un nome per restringerlo"></div>
    <div class="vassoio" id="vassoio" hidden></div>
    <div class="tempo" id="tempo"></div>
    <button class="lente" id="lente" aria-pressed="false"><span class="sw"></span><span>anche le mie proposte <span class="sg p">◌</span></span></button>
    <p class="legenda" id="legenda"></p>
    <div class="foglio" id="foglio" role="region" aria-label="Lettura"><button class="maniglia" id="maniglia" aria-label="Apri o chiudi il foglio"></button><div class="foglio-c" id="foglio-c"></div></div>
  </aside>
</div>
<div class="velo-t" id="velo-t" hidden></div>
<div class="tavola" id="tavola" hidden role="dialog" aria-modal="true" aria-label="Tavola">
  <div class="tt"><span class="marchio">tavola</span><div class="filo-a" id="filo"></div><button class="chiudi" id="chiudi" aria-label="Chiudi la tavola">×</button></div>
  <div class="corpo" id="tcorpo"><div class="asse" id="asse"><svg class="fili" id="tfili"></svg></div></div>
  <div class="piede" id="tpiede"></div>
</div>

<script>
'use strict';
/* =====================================================================
   DATI SINTETICI. Inventati per il prototipo: nessun frammento, nessuna
   persona, nessuna data del repository. Niente delicati, niente persone
   della vita (cerchia: vita), niente testi di canzoni.
   ===================================================================== */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20261105);

/* --- mezzogiorno: che cosa sta sulla linea */
function aMezzogiorno(r) {
  let best = null, bd = Infinity;

    const d = Math.abs(norm(n.base + S.rot[r.k] - NOON));
    if (d < bd) { bd = d; best = n; }
  }

    const forti = hit.filter((id) => FORTI.has(N[id].ring));

/* --- le etichette: lo zoom semantico. Da lontano solo la lettura di mezzogiorno; da vicino i nomi che ci stanno */

      const cls = `lbl mezzo${n.gen === 'opera' ? ' it' : ''}${best && !dentro.has(n.id) ? ' fuori' : ''}`;
      const wp = tw(nome, 12.5) + 16;
      el('rect', { x: ox + 9, y: yy - 12.5, width: wp, height: 17, rx: 8.5, fill: css('--carta'), opacity: .88 }, G.etic);
      const t2 = el('text', { class: cls, x: ox + 15, y: yy }, G.etic);
      t2.textContent = nome + (n.dedotto ? (n.accolto ? ' ●' : ' ◌') : '') + (n.gen === 'citazione' && !n.esito ? ' ⚠' : '');

/* --- i fili: dal nodo nel fuoco, alle cose che stanno nelle stesse frasi tue */

function fraseHTML(f, { classe = 'frase' } = {}) {

  const testa = f.imp ? `<span class="data">Entro il 28 febbraio, nell’archivio d’origine, trascritta da Claude nel seme:</span>` : `<span class="data">${dataL(f.reg)}</span>`;

    return `${testa}<p class="${classe}"><span style="font-size:.8em">hai trascritto ${op ? `un passo di <i>${esc(op.nome)}</i>` : 'un passo'}</span><span class="sg">✦</span> <i>${esc(f.testo)}</i><span class="sg">✦</span></p>
      <p class="mondo">«${esc(c.testo)}»<span class="sg">○</span><span class="luogo">${esc(c.rif)}</span></p>`;

}
// la frase-porta di un nodo: la tua, scritta a mano prima delle altre, la più recente
function frasiDi(id, lista = PASSANO) {
  const fs = lista.filter((f) => f.tutti.has(id) && (f.parlante || f.imp));
  return fs.sort((a, b) => (a.gen - b.gen) || (b.reg > a.reg ? 1 : -1));
}
function frasiProp(id) { return PASSANO.filter((f) => f.tuttiP.has(id) && !f.tutti.has(id)); }
function arco(fs) { const ps = fs.filter((f) => f.parlante); if (!ps.length) return ''; const a = ps.map((f) => f.reg).sort(); const m = (s) => MESI[+s.slice(5, 7) - 1]; return m(a[0]) === m(a[a.length - 1]) ? `a ${m(a[0])}` : `da ${m(a[0])} a ${m(a[a.length - 1])}`; }
function tipoNodo(n) {
  if (n.gen === 'opera') return `${n.tipo}${n.anno ? ' · ' + n.anno : ''}${n.autore ? ' · ' + N[n.autore].nome : ''}`;

  if (n.gen === 'persona') return `persona · ${n.cerchia === 'finzione' ? 'finzione · ' : ''}${n.campo.map((c) => c.replace(/-/g, ' ')).join(', ')} ◌`;

  if (n.gen === 'campo') return 'campo · classificazione mia ◌';

}
function conto(fs) { const p = fs.filter((f) => f.parlante).length; const i = fs.filter((f) => f.imp).length; return `${p ? `${p} ${p === 1 ? 'frase tua' : 'frasi tue'}, ${arco(fs)}` : ''}${i ? `${p ? ' · ' : ''}${i} dall’archivio d’origine` : ''}`; }
const CS = (t) => esc(t).replace(/([✦✧●◌○⚠])/g, (m) => `<span class="sg${m === '⚠' ? ' w' : m === '◌' ? ' p' : ''}">${m}</span>`);

    ${best ? fraseHTML(best.f) + `<p class="conto">Questa frase tiene insieme ${best.hit.length} anelli su ${RINGS.length}.</p>` : `<p class="frase" style="font-size:18px">Niente si aggancia ancora.</p><p class="conto">Nessuna frase tua tiene insieme due di queste cose. Gira un anello, o tocca il centro.</p>`}
    ${nFiltri() ? trovate() : ''}

// con un filtro: le frasi che restano, le più recenti (le righe di servizio senza segno)

function componi(n) {
  const asse = document.getElementById('asse'), corpo = document.getElementById('tcorpo');
  asse.querySelectorAll('.c').forEach((x) => x.remove());
  const tel = corpo.clientWidth < 600;
  const Wt = tel ? 560 : Math.min(corpo.clientWidth, 1180);
  const fs = frasiDi(n.id);
  const nFr = tel ? 5 : 8;
  const frasi = fs.slice(0, nFr);
  // le cose vicine: quelle che stanno nelle stesse frasi (✦ e ●), un passo
  const co = {};
  for (const f of fs) f.tutti.forEach((x) => { const m = N[x]; if (x === n.id || !m.R || m.R.arco) return; co[x] = (co[x] || 0) + (f.diretti.has(x) ? 2 : 1); });
  if (n.gen === 'opera' && n.autore) co[n.autore] = (co[n.autore] || 0) + 5;
  if (n.gen === 'persona') Object.values(N).filter((m) => m.autore === n.id && m.R && PESO[m.id].luce + PESO[m.id].imp).forEach((m) => (co[m.id] = (co[m.id] || 0) + 4));
  const vicini = Object.entries(co).sort((a, b) => b[1] - a[1]).slice(0, tel ? 7 : 11).map(([x]) => N[x]);
  const prop = S.lente ? [...new Set(frasiProp(n.id).flatMap(() => []).concat(fs.flatMap((f) => [...f.tuttiP])))].filter((x) => N[x].R && !N[x].R.arco && !co[x] && x !== n.id).slice(0, 2).map((x) => N[x]) : [];
  const carte = [];
  const add = (html, tipo, o = {}) => { const d = document.createElement(o.btn ? 'button' : 'div'); d.className = `c ${tipo} ${o.cls || ''}`; d.innerHTML = html; if (o.w) d.style.width = o.w + 'px'; if (o.id) d.dataset.id = o.id; asse.appendChild(d); const c = { d, tipo, ...o }; carte.push(c); return c; };
  const fsn = conto(fs);
  const titolo = add(`<div class="k">${CS(tipoNodo(n))}</div><h2>${n.gen === 'opera' ? `<i>${esc(n.nome)}</i>` : esc(n.nome)}${segnoNodo(n)}${n.gen === 'citazione' && !n.esito ? '<span class="sg w">⚠</span>' : ''}</h2><div class="n">${fsn || 'Niente si aggancia ancora.'}</div>`, 'c-titolo', { w: Math.min(Wt - 40, 340), fisso: true });
  // la citazione di un nodo-citazione, prima di tutto (○ con opera e passo; ⚠ senza)
  if (n.gen === 'citazione') {
    if (n.esito && n.testo && n.rif) add(`<p>«${esc(n.testo)}»<span class="sg">○</span></p><span class="luogo">${esc(n.rif)}</span><span class="luogo">${esc(N[n.autore].nome)} · ${n.esito}</span>`, 'c-cit', { w: Math.min(Wt - 60, 280), id: n.id, ruolo: 'cit' });
    else add(`<p>${esc(n.nome)}<span class="sg w">⚠</span></p><span class="luogo">${n.attribuita ? 'la attribuisci a ' + esc(N[n.attribuita].nome) + ' · ' : ''}da verificare</span>`, 'c-cit dub', { w: Math.min(Wt - 60, 260), id: n.id, ruolo: 'cit' });
  }
  frasi.forEach((f, i) => add(fraseHTML(f, { classe: '' }), 'c-frase' + (i === 0 ? ' porta' : ''), { w: i === 0 ? Math.min(Wt - 40, 380) : Math.min(Wt - 90, tel ? 230 : 270), f, btn: false }));
  for (const m of vicini.concat(prop)) {
    const p = prop.includes(m) ? ' c-prop' : '';
    if (m.gen === 'opera') add(`<span class="gl">${glifoSVG(m.tipo, 'var(--c-cose-t, #8fb6e6)', 12)}</span><i>${esc(m.nome)}</i><small>${m.tipo}${m.autore ? ' · ' + esc(N[m.autore].nome) : ''}${m.anno ? ' · ' + m.anno : ''}</small>`, 'c-opera' + p, { id: m.id, btn: true, w: tel ? 150 : 170 });
    else if (m.gen === 'persona') add(esc(m.nome), 'c-persona' + p, { id: m.id, btn: true });
    else if (m.gen === 'citazione') {
      if (m.esito && m.testo && m.rif) add(`<p>«${esc(m.testo)}»<span class="sg">○</span></p><span class="luogo">${esc(m.rif)}</span>`, 'c-cit' + p, { id: m.id, btn: true, w: tel ? 220 : 250 });
      else add(`<p>${esc(m.nome)}<span class="sg w">⚠</span></p><span class="luogo">da verificare</span>`, 'c-cit dub' + p, { id: m.id, btn: true, w: tel ? 200 : 230 });
    } else add(`<span class="pt"></span>${esc(m.nome)}${segnoNodo(m)}`, 'c-tema' + p, { id: m.id, btn: true, col: m.R.col });
  }
  carte.forEach((c) => { if (c.col) c.d.style.color = `color-mix(in srgb, var(${c.col}) 70%, #fff)`; });
  if (!fs.length && n.gen !== 'citazione') add('Niente si aggancia ancora, con questi filtri.', 'vuoto-t', { w: 260 });
  // misura, poi disponi: il titolo in alto, le frasi al centro come un filo che scende, le cose intorno
  carte.forEach((c) => { const b = c.d.getBoundingClientRect(); c.w = b.width; c.h = b.height; });
  const rand = mulberry32([...n.id].reduce((a, ch) => a * 31 + ch.charCodeAt(0), 7) >>> 0);
  const mid = Wt / 2;
  let y = 24;

  const frasiC = carte.filter((c) => c.f);

  frasiC.forEach((c, i) => {
    const lato = i === 0 ? 0 : (i % 2 ? -1 : 1);

  });
  // le cose: accanto alla frase che le nomina
  const sotto = altre.filter((c) => c.ruolo !== 'cit');
  sotto.forEach((c, i) => {
    const fr = frasiC.find((fc) => fc.f.tutti.has(c.id)) || frasiC[i % Math.max(1, frasiC.length)];
    const sx = i % 2 ? -1 : 1;
    c.x = tel ? (sx > 0 ? Wt - c.w - 14 - rand() * 20 : 14 + rand() * 20) : mid + sx * (Wt * (.3 + .1 * rand())) - c.w / 2;
    c.y = fr ? fr.y + fr.h * .3 + (rand() - .5) * 40 : y + i * 40;
    c.rot = c.tipo.includes('c-opera') || c.tipo.includes('c-cit') ? (rand() - .5) * 4 : 0;
  });
  // separare i rettangoli che si toccano (rilassamento): il titolo resta fermo
  const pad = tel ? 16 : 20;
  for (let it = 0; it < 600; it++) {
    let mosso = false;
    for (let i = 0; i < carte.length; i++) for (let j = i + 1; j < carte.length; j++) {
      const a = carte[i], b = carte[j];
      const ox = Math.min(a.x + a.w + pad, b.x + b.w + pad) - Math.max(a.x, b.x);
      const oy = Math.min(a.y + a.h + pad, b.y + b.h + pad) - Math.max(a.y, b.y);
      if (ox > 0 && oy > 0) {
        mosso = true;
        const fa = a.fisso ? 0 : b.fisso ? 1 : .5, fb = 1 - fa;
        if (ox < oy * (tel ? .5 : 1.1)) { const s = (a.x + a.w / 2 < b.x + b.w / 2 ? -1 : 1) * ox; a.x += s * fa; b.x -= s * fb; }
        else { const s = (a.y + a.h / 2 < b.y + b.h / 2 ? -1 : 1) * oy; a.y += s * fa; b.y -= s * fb; }
      }
    }
    carte.forEach((c) => { if (c.fisso) return; c.x = Math.max(10, Math.min(Wt - c.w - 10, c.x)); c.y = Math.max(titolo.y + titolo.h + 8, c.y); });
    if (!mosso) break;
  }
  const alto = Math.max(...carte.map((c) => c.y + c.h)) + 40;
  asse.style.width = Wt + 'px'; asse.style.height = alto + 'px';
  carte.forEach((c) => { c.d.style.transform = `translate(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px) rotate(${(RM ? 0 : c.rot || 0).toFixed(2)}deg)`; });
  // i fili: dalla frase alle cose che nomina; dal titolo alle frasi
  const fili = document.getElementById('tfili');
  fili.setAttribute('width', Wt); fili.setAttribute('height', alto); fili.innerHTML = '';
  const cen = (c) => c === titolo ? [c.x + c.w / 2, c.y + c.h - 4] : [c.x + c.w / 2, c.y + c.h / 2];
  const linea = (a, b, col, op, w = 1) => { const [x1, y1] = cen(a), [x2, y2] = cen(b); const mx = (x1 + x2) / 2 + (y2 - y1) * .12, my = (y1 + y2) / 2 - (x2 - x1) * .12; const p = el('path', { d: `M${x1},${y1}Q${mx},${my} ${x2},${y2}`, stroke: col, 'stroke-width': w, opacity: op, fill: 'none' }, fili); p.dataset.a = carte.indexOf(a); p.dataset.b = carte.indexOf(b); };
  frasiC.forEach((fc) => linea(titolo, fc, '#efe7d8', .18));
  for (const fc of frasiC) for (const c of altre) if (c.id && (fc.f.tutti.has(c.id) || fc.f.tuttiP.has(c.id))) linea(fc, c, c.tipo.includes('c-prop') ? '#8f897e' : '#e7c27a', c.tipo.includes('c-prop') ? .3 : .62, c.tipo.includes('c-prop') ? .8 : 1.4);
  for (const c of citC) linea(titolo, c, '#efe7d8', .3);
  // toccare una cosa apre la sua tavola; toccare una frase accende i suoi fili
  carte.forEach((c, i) => {
    if (c.id && c.btn) c.d.onclick = () => { corpo.scrollTop = 0; apriTavola(c.id, true); };
    if (c.f) { c.d.style.cursor = 'pointer'; c.d.onclick = () => evidenzia(i, carte); }
  });
  corpo.scrollTop = 0; corpo.scrollLeft = Math.max(0, (Wt - corpo.clientWidth) / 2);
}
function evidenzia(i, carte) {
  const fili = [...document.querySelectorAll('#tfili path')];
  const att = carte[i].d.classList.toggle('acceso');
  const leg = new Set([i]);
  fili.forEach((p) => { const a = +p.dataset.a, b = +p.dataset.b; if (a === i || b === i) { leg.add(a); leg.add(b); } });
  carte.forEach((c, j) => c.d.classList.toggle('spento', att && !leg.has(j)));
  carte.forEach((c, j) => { if (j !== i) c.d.classList.remove('acceso'); });
}
