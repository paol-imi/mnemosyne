<html lang="it">

<title>Mnemosyne</title>
<script>
  // Lo script anti-lampo (atlante-sito §5.1): il tema segue il sistema; ?tema= serve solo alle foto del prototipo.
  (function () {
    var t = new URLSearchParams(location.search).get('tema');
    if (t === 'scuro') document.documentElement.dataset.theme = 'dark';
    if (t === 'chiaro') document.documentElement.dataset.theme = 'light';
    var s = 1; try { var v = localStorage.getItem('mn-strato'); if (v !== null) s = +v; } catch (e) {}
    document.documentElement.dataset.strato = String(s);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
<style>
:root {
  --carta: #f5f1e8; --campo: #ebe5d8; --inchiostro: #1c1a17; --tenue: #6a645a; --filo: #d9d1c1; --velo: rgba(28,26,23,.06);
  --sotto: #fbf8f2; --ombra: 0 -8px 30px rgba(0,0,0,.12);
  --corpo: 18px; --misura: 34em;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #151412; --campo: #0c0b0a; --inchiostro: #e8e2d6; --tenue: #9b9488; --filo: #2e2b27; --velo: rgba(232,226,214,.06);
    --sotto: #1d1b18; --ombra: 0 -8px 30px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #151412; --campo: #0c0b0a; --inchiostro: #e8e2d6; --tenue: #9b9488; --filo: #2e2b27; --velo: rgba(232,226,214,.06);
  --sotto: #1d1b18; --ombra: 0 -8px 30px rgba(0,0,0,.5); color-scheme: dark;
}
@media (min-width: 900px) { :root { --corpo: 20px; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--carta); color: var(--inchiostro);
  font: 400 var(--corpo)/1.45 "Source Serif 4", "Iowan Old Style", Georgia, serif;
  font-optical-sizing: auto; font-variant-numeric: oldstyle-nums proportional-nums;
  -webkit-font-smoothing: antialiased; padding-bottom: 72px;
}
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .18em; text-decoration-color: var(--filo); }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--inchiostro); outline-offset: 3px; }
.pagina { max-width: var(--misura); margin: 0 auto; padding: 0 16px; }
.larga { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.testa { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 0 6px; }
.marchio, .sc { font-variant-caps: all-small-caps; letter-spacing: .07em; font-size: .82em; color: var(--tenue); }
.marchio { text-decoration: none; }
h1 { font-weight: 500; font-size: 1.55em; line-height: 1.15; margin: .5em 0 .15em; font-variation-settings: "opsz" 48; letter-spacing: -.005em; }
h2 { font-weight: 500; font-size: .82em; font-variant-caps: all-small-caps; letter-spacing: .08em; color: var(--tenue); margin: 2.2em 0 .6em; }
p { margin: 0 0 .8em; }
.servizio { color: var(--tenue); font-size: .88em; }
.legenda { color: var(--tenue); font-size: .8em; margin: 0 0 1.4em; }

/* I segni: peso tipografico, mai colore d'allarme */
.sg { font-family: "Noto Sans Symbols 2", "Segoe UI Symbol", sans-serif; font-style: normal; font-size: .7em; vertical-align: .12em; }
.righe a, .frase a, .porta, .pezzo a { text-decoration: none; }
body.foto .barra { position: static; }
.foglio { visibility: hidden; }
body.aperto .foglio { visibility: visible; }
.sua { font-style: italic; }
.sua .sg, .seme .sg, .acc .sg { color: var(--inchiostro); }
.seme { font-style: italic; }
.prop, .prop .sg { color: var(--tenue); font-weight: 350; }
.mondo { }
.mondo .sg { color: var(--tenue); }
.luogo { display: block; font-size: .78em; color: var(--tenue); font-style: normal; margin-top: .15em; }
.vf { font-size: .62em; vertical-align: .3em; margin-left: .2em; font-family: "Noto Sans Symbols 2", sans-serif; }
.data { display: block; font-size: .78em; color: var(--tenue); font-variant-numeric: lining-nums; letter-spacing: .01em; margin-bottom: .1em; }
.nota-r { display: block; font-size: .78em; color: var(--tenue); margin: 1.2em 0 .2em; }

/* Strati: 0 = mie, 1 = e accolte, 2 = e proposte */
[data-strato="0"] .l1, [data-strato="0"] .l2, [data-strato="1"] .l2 { display: none; }
[data-strato="2"] .nascosti { display: none; }
.strati { display: inline-flex; border: 1px solid var(--filo); border-radius: 999px; padding: 2px; font-size: .74em; margin: .3em 0 1.2em; }
.strati button { all: unset; cursor: pointer; padding: .35em .8em; border-radius: 999px; color: var(--tenue); min-height: 28px; line-height: 28px; padding-top: 0; padding-bottom: 0; }
[data-strato="0"] .strati [data-s="0"], [data-strato="1"] .strati [data-s="1"], [data-strato="2"] .strati [data-s="2"] { background: var(--inchiostro); color: var(--carta); }
.strati button:focus-visible { outline: 2px solid var(--inchiostro); }
.nascosti { all: unset; cursor: pointer; color: var(--tenue); font-size: .82em; display: block; padding: .6em 0; }

/* La soglia */
.soglia { min-height: calc(100svh - 120px); display: flex; flex-direction: column; justify-content: flex-start; padding-top: 11svh; }
.soglia .quando { font-size: .82em; color: var(--tenue); margin: 2.2em 0 1.6em; }
.coppia { margin: 0; }
.coppia .frase { font-size: 1.32em; line-height: 1.3; font-variation-settings: "opsz" 36; margin: 0; }
.intervallo { display: flex; align-items: center; gap: .7em; margin: 1.2em 0; color: var(--tenue); font-size: .74em; }
.intervallo::before { content: ""; width: 1px; height: 3.2em; background: var(--filo); margin-left: .2em; }
.respiro { opacity: 0; animation: respiro .9s ease-out .7s forwards; }
@keyframes respiro { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .respiro { animation: none; opacity: 1; } }
.apri { display: inline-block; margin-top: 1.6em; font-size: .9em; }
.porte { margin-top: 1em; padding: 2.4em 0 1.5em; border-top: 1px solid var(--filo); display: grid; grid-template-columns: 1fr 1fr; gap: 1.1em 1em; }
.porta { text-decoration: none; display: block; min-height: 44px; }
.porta b { display: block; font-weight: 500; font-size: .95em; }
.porta span { display: block; font-size: .74em; color: var(--tenue); font-style: italic; line-height: 1.35; margin-top: .15em; }
.porta span.r { font-style: normal; }

/* Liste di frasi */
.righe { list-style: none; padding: 0; margin: 0; }
.righe li { padding: .7em 0; border-bottom: 1px solid var(--velo); }
.righe li:last-child { border-bottom: 0; }
.righe a { text-decoration: none; }
.numerate { list-style: decimal; padding-left: 1.6em; }
.numerate li::marker { color: var(--tenue); font-size: .8em; font-variant-numeric: lining-nums; }
.mese { margin-top: 2em; }
.mese > h2 { margin-top: 0; }
.coda::after { content: "da tempo"; font-size: .62em; font-variant-caps: all-small-caps; letter-spacing: .08em; color: var(--tenue); margin-left: .6em; font-style: normal; }
.delic { all: unset; cursor: pointer; color: var(--tenue); font-size: .82em; padding: .7em 0; display: block; }

/* La restituzione come tavola */
.tavola-r { background: var(--campo); margin: 0 -16px; padding: 22px 16px 26px; }
.voce { display: grid; grid-template-columns: 2.1em 1fr; gap: 0 .3em; padding: .55em 0; }
.num { all: unset; cursor: pointer; font-variant-numeric: lining-nums tabular-nums; font-size: .8em; width: 1.9em; height: 1.9em; border: 1px solid var(--filo); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-top: .1em; background: var(--carta); }
.num:focus-visible { outline: 2px solid var(--inchiostro); }
.affiancate { display: grid; gap: 1.1em; margin: .4em 0 1.2em; }
@media (min-width: 900px) { .affiancate { grid-template-columns: 1fr 1fr; gap: 2em; } }
.affiancate .frase { font-size: 1.12em; line-height: 1.32; }
.chiusa { margin-top: 1.2em; }

/* Il foglio dal basso */
.velo { position: fixed; inset: 0; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.foglio { position: fixed; left: 0; right: 0; bottom: 0; background: var(--sotto); box-shadow: var(--ombra); border-radius: 14px 14px 0 0; padding: 10px 16px 28px; transform: translateY(105%); transition: transform .22s cubic-bezier(.2,.8,.2,1); z-index: 21; max-height: 78svh; overflow: auto; }
.foglio .maniglia { width: 36px; height: 4px; border-radius: 2px; background: var(--filo); margin: 0 auto 12px; }
body.aperto .velo { opacity: 1; pointer-events: auto; }
body.aperto .foglio { transform: none; }
@media (min-width: 900px) { .foglio { left: auto; right: 24px; bottom: 24px; width: 420px; border-radius: 14px; } }
@media (prefers-reduced-motion: reduce) { .foglio, .velo { transition: none; } }
.gesti { display: grid; gap: .5em; margin-top: 1em; }
.gesto { display: block; text-decoration: none; border: 1px solid var(--filo); border-radius: 10px; padding: .6em .8em; min-height: 44px; }
.gesto b { font-weight: 500; font-size: .9em; }
.gesto code { display: block; font: .7em/1.4 ui-monospace, Menlo, monospace; color: var(--tenue); margin-top: .2em; word-break: break-all; }

/* Il nodo */
.conto { font-size: .78em; color: var(--tenue); font-variant-numeric: lining-nums; }
.incrocio { margin: 1.4em 0 1.6em; }
.nomi-x { display: flex; align-items: center; gap: .6em; font-variant-caps: all-small-caps; letter-spacing: .07em; font-size: .9em; margin: 0 0 .6em; color: var(--tenue); }
.nomi-x a { text-decoration: none; color: var(--inchiostro); }
.nomi-x .x { flex: 1; border-top: 1px solid var(--inchiostro); }
.frase.grande { font-size: 1.28em; line-height: 1.3; font-variation-settings: "opsz" 36; margin: 0; }
.conv { border-left: 1px solid var(--filo); padding-left: 1em; margin: .6em 0 1em; }
.binari { display: grid; grid-template-columns: 1fr 1fr; gap: .2em 1em; font-size: .86em; margin-top: 1em; }
.binari a { display: block; padding: .5em 0; min-height: 44px; text-decoration: none; }
.binari small { display: block; color: var(--tenue); font-size: .8em; }
details { margin: .4em 0; }
summary { cursor: pointer; color: var(--tenue); font-size: .86em; padding: .5em 0; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "＋ "; font-size: .8em; }
details[open] summary::before { content: "－ "; }
.corpo { font-size: 1.18em; line-height: 1.4; margin: .2em 0 .6em; white-space: pre-wrap; }

/* La tavola del nodo: zoom semantico */
.tela { position: relative; background: var(--campo); margin: 0 -16px; overflow: hidden; touch-action: manipulation; }
.tela svg { display: block; width: 100%; height: auto; transition: transform .32s cubic-bezier(.2,.8,.2,1); transform-origin: 50% 50%; }
@media (prefers-reduced-motion: reduce) { .tela svg { transition: none; } }
.tela text { fill: var(--inchiostro); font-family: "Source Serif 4", Georgia, serif; }
.tela .t-tenue { fill: var(--tenue); }
.tela line { stroke: var(--filo); stroke-width: 1; }
.tela line.acceso { stroke: var(--inchiostro); }
.tela .n { cursor: pointer; }
.tela .n rect { fill: transparent; }
.tela .n:focus { outline: none; }
.tela .n:focus-visible rect { stroke: var(--inchiostro); }
.tela svg.zoomato .n:not(.sel) text { opacity: .3; }
.tela svg.zoomato .n.sel text { font-weight: 600; }
.livello { font-size: .78em; color: var(--tenue); margin: .8em 0; }

/* La tavola dei tatuaggi */
.campo-t { background: #11100e; color: #ece6da; margin: 0 -16px; padding: 18px 14px 26px; }
.campo-t .sc, .campo-t .legenda, .campo-t .servizio, .campo-t .data, .campo-t .luogo { color: #a39c90; }
.campo-t .sg { color: #ece6da; }
.pezzi { display: grid; grid-template-columns: repeat(6, 1fr); gap: 22px 14px; grid-auto-flow: dense; }
.pezzo { border: 1px solid #3a3631; padding: 12px; background: #191714; }
.pezzo.g { grid-column: span 6; }
.pezzo.m { grid-column: span 3; }
.pezzo.p { grid-column: span 3; padding: 10px; }
@media (min-width: 900px) { .pezzi { grid-template-columns: repeat(12, 1fr); gap: 34px 26px; } .pezzo.g { grid-column: span 5; grid-row: span 2; } .pezzo.m { grid-column: span 4; } .pezzo.p { grid-column: span 3; } }
.pezzo .frase { font-style: italic; line-height: 1.3; }
.pezzo.g .frase { font-size: 1.15em; }
.pezzo.m .frase { font-size: .92em; }
.pezzo.p .frase, .pezzo.p { font-size: .76em; }
.pezzo svg { width: 100%; height: auto; display: block; margin-bottom: 10px; }
.pezzo svg path, .pezzo svg circle, .pezzo svg line { stroke: #ece6da; fill: none; stroke-width: 1.4; }
.filo-t { grid-column: 1 / -1; display: flex; align-items: center; gap: .6em; font-size: .7em; color: #a39c90; letter-spacing: .03em; margin: -8px 0; }
.filo-t::before, .filo-t::after { content: ""; flex: 1; border-top: 1px dashed #3a3631; }
.margine { margin-top: 26px; padding-top: 14px; border-top: 1px solid #2a2723; color: #8f887c; font-size: .8em; font-weight: 350; }
.pin { font-style: normal !important; }
.pin a { color: #ece6da; }

/* Stampa: il brief */
@media print {
  body { background: #fff; color: #000; padding: 0; font-size: 12pt; }
  .barra, .testa .strumenti, .velo, .foglio, .no-stampa, .margine { display: none !important; }
  .campo-t { background: #fff; color: #000; margin: 0; padding: 0; }
  .campo-t .sc, .campo-t .legenda, .campo-t .data, .campo-t .luogo, .filo-t { color: #444; }
  .campo-t .sg, .pin a { color: #000; }
  .pezzo { background: #fff; border-color: #bbb; break-inside: avoid; }
  .pezzo svg path, .pezzo svg circle, .pezzo svg line { stroke: #000; }
}
.stampa-v .campo-t { background: #fff; color: #111; }
.stampa-v .pezzo { background: #fff; border-color: #c9c3b8; }
.stampa-v .pezzo svg path, .stampa-v .pezzo svg circle, .stampa-v .pezzo svg line { stroke: #111; }
.stampa-v .campo-t .sg, .stampa-v .pin a { color: #111; }
.stampa-v .campo-t .sc, .stampa-v .campo-t .legenda, .stampa-v .campo-t .data, .stampa-v .campo-t .luogo, .stampa-v .filo-t { color: #555; }

/* Cerca */
.campo-cerca { width: 100%; font: inherit; font-size: 1.05em; padding: .6em .8em; border: 1px solid var(--filo); border-radius: 10px; background: var(--sotto); color: var(--inchiostro); }
mark { background: none; color: inherit; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: .15em; }

/* Il tempo: quadratini tutti uguali, senza scala */
.nodo-soglia { padding-top: 6svh; min-height: 0; padding-bottom: 3em; }
.piede .strati { margin: .2em 0 0; font-size: .66em; }
.nodo-soglia h1 { margin-bottom: 1.2em; }
.giorni { display: grid; grid-template-columns: repeat(7, 14px); gap: 4px; margin: .4em 0 .8em; }
.giorni i { width: 14px; height: 14px; border: 1px solid var(--filo); border-radius: 2px; }
.giorni i.a { background: var(--inchiostro); border-color: var(--inchiostro); }
.giorni i.v { visibility: hidden; }
.lettore { display: flex; align-items: center; gap: .6em; font-size: .72em; color: var(--tenue); margin: 1em 0; }
.lettore::before, .lettore::after { content: ""; flex: 1; border-top: 1px dotted var(--filo); }
.pos { border-left: 1px solid var(--inchiostro); padding-left: .9em; margin: .6em 0 1em; }
@media (min-width: 900px) {
  .tempo-griglia { display: grid; grid-template-columns: 200px 1fr; gap: 0 40px; }
}

/* Barra in basso */
.barra { position: fixed; left: 0; right: 0; bottom: 0; background: var(--carta); border-top: 1px solid var(--filo); display: flex; justify-content: space-around; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 10; }
.barra a { text-decoration: none; font-variant-caps: all-small-caps; letter-spacing: .08em; font-size: .82em; color: var(--tenue); min-height: 44px; min-width: 56px; display: flex; align-items: center; justify-content: center; }
.barra a.qui { color: var(--inchiostro); text-decoration: underline; text-decoration-color: var(--inchiostro); text-underline-offset: .4em; }
@media (min-width: 900px) {
  body { padding-bottom: 0; }
  .barra { position: sticky; top: 0; bottom: auto; justify-content: center; gap: 28px; border-top: 0; border-bottom: 1px solid var(--filo); }
  .soglia { min-height: calc(100svh - 140px); }
  .pannelli { display: grid; grid-template-columns: minmax(0, 34em) 1fr; gap: 56px; max-width: 1180px; margin: 0 auto; padding: 0 24px; }
  .pannelli > .pagina { margin: 0; padding: 0; }
  .lato { border-left: 1px solid var(--filo); padding-left: 32px; font-size: .9em; }
}
@media (max-width: 899px) { .lato { display: none; } }
</style>
</head>

function risultati(q) {
  q = q.trim().toLowerCase(); if (!q) return '<p class="servizio">Le tue parole e i nomi.</p>';
  const norm = (s) => s.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
  const tuoi = Object.keys(F).filter((id) => !F[id].delicato && !F[id].nonParlante && norm(F[id].testo).includes(norm(q))).reverse();
  const nodi = Object.keys(NODI).filter((s) => norm(NODI[s].nome).includes(norm(q)));
  const evid = (t) => esc(t).replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig'), '<mark>$1</mark>');
  return `<h2>le tue parole · ${tuoi.length}</h2><ul class="righe">${tuoi.map((id) => `<li><span class="data">${imp(id) ? tetto(id) + ', trascritta da Claude nel seme:' : dataL(F[id].reg)}</span><a href="#/frammento/${id}"><span class="sua">${evid(F[id].testo)}${sg('sua')}</span></a></li>`).join('') || '<li class="servizio">Nessuna tua parola.</li>'}</ul>
    <h2>nomi · ${nodi.length}</h2><ul class="righe">${nodi.map((s) => `<li><a href="#/nodo/${s}">${NODI[s].nome}</a> <span class="conto">${NODI[s].genere}</span></li>`).join('') || '<li class="servizio">Nessun nome.</li>'}</ul>`;
}

/* ===== Router ===== */
function vai() {
  const h = location.hash.replace(/^#\/?/, '');
  const [a, b, c] = h.split('/');
  const stato = new URLSearchParams(location.search).get('soglia');
  let html;
  if (!a) html = V.soglia(stato);
  else if (a === 'ritorno') html = V.soglia('ritorno');
  else if (a === 'r') html = V.lettera();
  else if (a === 'nodo' && c === 'tavola') html = V.tavolaNodo();
  else if (a === 'nodo') html = V.nodo(b);
  else if (a === 'frammento') html = V.frammento(b);
  else if (a === 'tempo') html = V.tempo();
  else if (a === 'frasi') html = V.frasi();
  else if (a === 'cerca') html = V.cerca();
  else if (a === 'assenze') html = V.assenze();
  else if (a === 'tatuaggi') html = V.tatuaggi(b === 'stampa');
  else html = V.vuoto();
  document.getElementById('vista').innerHTML = html;
  document.querySelectorAll('.barra a').forEach((x) => x.classList.toggle('qui', x.dataset.r === (a || '')));
  chiudi(); window.scrollTo(0, 0);
  if (a === 'cerca') { const q = document.getElementById('q'); const r = () => (document.getElementById('ris').innerHTML = risultati(q.value)); q.addEventListener('input', r); r(); }
}
function apri(html) { document.getElementById('foglio-c').innerHTML = html; document.body.classList.add('aperto'); }
function chiudi() { document.body.classList.remove('aperto'); }
document.addEventListener('click', (e) => {
  const s = e.target.closest('[data-s]');
  if (s) { document.documentElement.dataset.strato = s.dataset.s; try { localStorage.setItem('mn-strato', s.dataset.s); } catch (x) {} return; }
  const v = e.target.closest('[data-voce]'); if (v) return apri(foglioVoce(v.dataset.voce));
  if (e.target.id === 'velo') return chiudi();
  if (e.target.id === 'delic') { e.target.outerHTML = `<p style="margin:.6em 0">${frase('20261011-0210-f3b6')}</p>`; return; }
  const n = e.target.closest('.tela [data-n]'); if (n) zoom(n.dataset.n);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') chiudi(); if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tela [data-n]')) { e.preventDefault(); zoom(e.target.dataset.n); } });
function zoom(slug) {
  const p = window.__vicini.find((x) => x.s === slug); const svg = document.querySelector('.tela svg');
  const dx = (180 - (180 + p.x) / 2) * 1.6, dy = (180 - (180 + p.y) / 2) * 1.6;
  svg.style.transform = `translate(${dx / 3.6}%, ${dy / 3.6}%) scale(1.6)`;
  svg.classList.add('zoomato'); document.querySelectorAll('.tela .n').forEach((g) => g.classList.toggle('sel', g.dataset.n === slug));
  document.querySelectorAll('.tela line').forEach((l) => l.classList.toggle('acceso', l.dataset.l === slug));
  document.getElementById('livello').innerHTML = `frasi · attenzione — ${NODI[slug].nome} · <a href="#" id="indietro">tutti i nomi</a>`;
  document.getElementById('zoom').innerHTML = p.frasi.length
    ? `<h2>le frasi che li tengono insieme</h2><ul class="righe">${p.frasi.map((id) => `<li>${frase(id)}</li>`).join('')}</ul><p><a href="#/nodo/${slug}">${NODI[slug].nome} →</a></p>`
    : `<p class="servizio" style="margin-top:1em">Nessuna tua frase li tiene insieme: ${esc(p.via)}.</p><p><a href="#/nodo/${slug}">${NODI[slug].nome} →</a></p>`;
  document.getElementById('indietro').onclick = (e) => { e.preventDefault(); vai(); };
}
addEventListener('hashchange', vai);
vai();
</script>
